<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tree of Life — Sacred Trees of the World</title>
<meta name="description" content="An interactive atlas of 57 sacred and mythic trees from ten world traditions — Yggdrasil, Bodhi, Ashvattha, Wang, Qilin, and more.">
<style>
  :root{
    --bg0:#070b09; --bg1:#0d1512; --ink:#e8e2d4; --ink-dim:#9aa392;
    --line:#2a3a30; --panel:#0f1713; --node:#141d18; --gold:#c9a86a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family: Georgia,'Iowan Old Style','Palatino Linotype',serif;
    background: radial-gradient(120% 90% at 50% 15%, var(--bg1) 0%, var(--bg0) 70%);
    color:var(--ink); overflow:hidden;
  }
  header{
    position:fixed; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; gap:18px; padding:14px 22px;
    background:linear-gradient(180deg, rgba(7,11,9,.92), rgba(7,11,9,.55) 80%, transparent);
    backdrop-filter: blur(6px);
  }
  .brand{display:flex; align-items:center; gap:12px; min-width:0}
  .brand svg{width:34px;height:34px;flex:none}
  .brand h1{font-size:17px; letter-spacing:.22em; font-weight:600; white-space:nowrap}
  .brand .sub{font-size:11.5px; color:var(--ink-dim); letter-spacing:.04em; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  header .spacer{flex:1}
  .navlink{
    flex:none; text-decoration:none; color:var(--gold); font-size:12.5px; letter-spacing:.05em; font-weight:600;
    border:1px solid var(--gold); background:rgba(201,168,106,.07); border-radius:999px; padding:8px 15px;
    white-space:nowrap; transition:background .2s, color .2s, border-color .2s; cursor:pointer;
  }
  .navlink:hover{background:var(--gold); color:#141d18}
  #search{
    background:rgba(20,29,24,.8); border:1px solid var(--line); color:var(--ink);
    border-radius:999px; padding:8px 16px; font:inherit; font-size:13.5px; width:230px;
    outline:none; transition:border-color .2s, width .25s;
  }
  #search:focus{border-color:var(--gold); width:280px}
  #search::placeholder{color:#6d786b}
  #count{font-size:12px; color:var(--ink-dim); letter-spacing:.06em; white-space:nowrap}
  main{display:flex; height:100%; width:100%}
  #stage{flex:1; position:relative; min-width:0}
  #tree{width:100%; height:100%; display:block}
  .branch{fill:none; stroke:#415247; stroke-linecap:round; transition:stroke .3s, opacity .3s}
  .trunk{fill:#243029}
  .trunk-edge{fill:none; stroke:#415247; stroke-width:1.5}
  .ground{fill:#1a241e}
  .glow{pointer-events:none}
  .node{cursor:pointer; transition:opacity .3s}
  .node circle.body{fill:var(--node); stroke-width:2; transition:transform .18s ease, stroke-width .18s; transform-box:fill-box; transform-origin:center}
  .node:hover circle.body{transform:scale(1.28); stroke-width:3}
  .node.dim{opacity:.14; pointer-events:none}
  .node.active circle.body{stroke-width:3.5; filter:drop-shadow(0 0 10px currentColor)}
  .node text{font-family:Georgia,serif}
  .rlabel{cursor:pointer}
  .rlabel text{fill:var(--ink); font-size:15px; letter-spacing:.14em; opacity:.82; transition:opacity .2s, fill .2s}
  .rlabel .rcount{fill:var(--ink-dim); font-size:11px; letter-spacing:.1em}
  .rlabel:hover text{opacity:1; fill:var(--gold)}
  .rlabel.dim{opacity:.25}
  /* panel */
  #panel{
    position:fixed; top:0; right:0; bottom:0; width:min(460px, 94vw); z-index:30;
    background:var(--panel); border-left:1px solid var(--line);
    transform:translateX(105%); transition:transform .35s cubic-bezier(.22,.8,.3,1);
    display:flex; flex-direction:column;
  }
  #panel.open{transform:translateX(0); box-shadow:-30px 0 60px rgba(0,0,0,.5)}
  .p-head{position:relative; padding:26px 28px 18px; border-bottom:1px solid var(--line); background:radial-gradient(90% 130% at 20% 0%, rgba(255,255,255,.03), transparent)}
  #close{
    position:absolute; top:16px; right:16px; width:32px; height:32px; border-radius:50%;
    border:1px solid var(--line); background:transparent; color:var(--ink-dim);
    font-size:15px; cursor:pointer; line-height:1; transition:all .2s;
  }
  #close:hover{color:var(--ink); border-color:var(--gold)}
  .p-emblem{width:64px; height:64px; margin-bottom:14px}
  .p-emblem svg{width:100%; height:100%}
  #panel h2{font-size:23px; line-height:1.25; font-weight:600; padding-right:36px}
  .native{font-size:14px; color:var(--ink-dim); margin-top:6px; font-style:italic; line-height:1.45}
  .meta{display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; margin-top:16px}
  .meta .k{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); opacity:.85}
  .meta .v{font-size:13.5px; line-height:1.45; margin-top:2px}
  .p-body{overflow-y:auto; padding:22px 28px 40px; flex:1; scrollbar-width:thin; scrollbar-color:#2a3a30 transparent}
  .p-body h3{font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); margin:26px 0 9px; font-weight:600}
  .p-body h3:first-child{margin-top:0}
  .p-body p{font-size:14.5px; line-height:1.72; color:#d6d2c4}
  .p-photo{margin:0 0 4px; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:rgba(255,255,255,.03)}
  .p-photo img{display:block; width:100%; height:250px; object-fit:cover}
  .p-photo figcaption{font-size:11px; color:#5c685c; line-height:1.55; padding:8px 12px; border-top:1px solid var(--line)}
  .chips{display:flex; flex-wrap:wrap; gap:7px}
  .chip{font-size:12.5px; border:1px solid var(--line); border-radius:999px; padding:4px 12px; color:#cfd6c6; background:rgba(255,255,255,.02)}
  .src{list-style:none; margin-top:2px}
  .src li{font-size:13px; color:var(--ink-dim); line-height:1.6; padding:4px 0 4px 16px; position:relative}
  .src li:before{content:"—"; position:absolute; left:0; color:#4a5a4e}
  .footer-note{font-size:11px; color:#5c685c; line-height:1.6; margin-top:26px; border-top:1px solid var(--line); padding-top:14px}
  #hint{
    position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
    font-size:12px; color:var(--ink-dim); letter-spacing:.08em; white-space:nowrap;
    transition:opacity .6s;
  }
  @media (max-width:900px){
    .brand .sub{display:none}
    #search{width:150px}
    #count{display:none}
    .navlink{padding:7px 11px; font-size:11.5px}
  }
</style>
</head>

<header>
  <div class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <path d="M20 36 L20 20 M20 24 L12 13 M20 22 L28 11 M12 13 L9 9 M28 11 L31 7" stroke="#c9a86a" stroke-width="2" fill="none" stroke-linecap="round"/>

</header>
<main>
  <div id="stage">
    <svg id="tree" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Tree of life with ten regional branches"></svg>
    <div id="hint">click a glowing node to read its story · click a branch name to focus a region</div>

</main>

  <div class="p-head">
    <button id="close" aria-label="Close">✕</button>

    <div class="native" id="p-native"></div>
    <div class="meta" id="p-meta"></div>
  </div>
  <div class="p-body" id="p-body"></div>
</aside>

<script>
const DATA = [{"id": "garden-eden", "name": "Tree of the Knowledge of Good and Evil", "native": "עץ הדעת טוב ורע · etz ha-da'at tov va-ra", "culture": "Hebrew / Ancient Near East", "region": "ancient-near-east", "era": "Second Temple period codified (6th c. BCE onward)", "type": "Biblical / mythological tree", "tree": "Unspecified (interpreted as fig, grape, or wheat in later exegesis)", "story": "In the Garden of Eden, God plants a garden and sets in it two trees: the Tree of Life and the Tree of the Knowledge of Good and Evil. God commands Adam and Eve not to eat from the tree of knowledge, but the serpent tempts them. They eat, gain the knowledge of good and evil, and are cast from the garden, where cherubim and a flaming sword guard the way to the Tree of Life.", "history": "The narrative in Genesis 2-3 is among the oldest and most retold creation myths in world literature. Later Jewish, Christian, and Islamic exegesis debated the tree's identity — the Targums and Church Fathers proposed the fig (the fig-leaf in Eden), the vine, or wheat. Medieval and Renaissance art fixed the tree as a central image of original sin and redemption.", "details": "The tree functions as the archetypal forbidden fruit and the boundary between innocence and self-awareness. Its pairing with the Tree of Life encodes a theology of mortality: eating knowledge brings death, while the guarded Tree of Life offers the immortality humans forfeited. It became the single most reproduced 'tree of life' in Western art, from Byzantine icons to the Gothic Book of Kells and beyond.", "symbolism": ["forbidden knowledge", "original sin", "mortality vs. immortality", "divine command", "temptation"], "sources": ["Genesis 2-3", "Targum Onqelos", "Augustine, City of God", "Book of Kells"], "emblem": {"form": "round", "accent": "#7b4b2a", "fruit": true}, "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2e/Ficus_carica_L%2C_1771.jpg/500px-Ficus_carica_L%2C_1771.jpg", "label": "Fig", "title": "Ficus carica"}}, {"id": "gilgamesh-tree", "name": "The Lapis Tree of Gilgamesh", "native": "nigal (cypress) of the cedar groves", "culture": "Sumerian / Mesopotamian", "region": "ancient-near-east", "era": "Sumerian period; Epic of Gilgamesh ca. 2100-1200 BCE", "type": "Mythological tree / quest object", "tree": "Lapis / cedar", "story": "After killing Humbaba, guardian of the Cedar Forest of the gods, the hero Gilgamesh and his companion Enkidu journey to the land of the gods. In some versions Gilgamesh receives a wondrous tree (a lapis tree or a 'tree of life' / 'plant of immortality') that confers eternal life; he leaves it behind, and it is lost to the mortal world.", "history": "The Epic of Gilgamesh is the oldest known great work of literature. The episode where Gilgamesh seeks the plant of immortality and it is snatched by a serpent is a direct narrative ancestor of the Eden story and of countless 'quest for the elixir' myths. Mesopotamian palace reliefs show stylized sacred trees (the 'tree of life' motif) with a deity at the base, a standard icon from the 4th millennium BCE onward.", "details": "The Mesopotamian sacred tree — often a cypress or cedar with banded trunk and a star or deity at its base — is one of humanity's oldest continuous visual symbols. It marks the axis between earth and heaven and the seat of divine kingship. The lost plant of Gilgamesh embodies the recurring theme of immortality glimpsed and then forfeited.", "symbolism": ["axis mundi", "divine kingship", "lost immortality", "cosmic order"], "sources": ["Epic of Gilgamesh (Tablet XI)", "Assyrian palace reliefs, Nimrud & Nineveh"], "emblem": {"form": "conical", "accent": "#3f6f8f", "bands": true}, "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/ed/View_from_the_Barouk_Forest_1.JPG/500px-View_from_the_Barouk_Forest_1.JPG", "label": "Cedrus", "title": "Cedrus"}}, {"id": "sumerian-sacred-tree", "name": "Sumerian Tree of Life (Nigal)", "native": "nigal / nì-gál", "culture": "Sumerian", "region": "ancient-near-east", "era": "4th-3rd millennium BCE", "type": "Icon / cult object", "tree": "Cypress / date palm (stylized)", "story": "In Sumerian myth the sacred tree stands at the meeting of heaven and earth. The goddess Inanna (Ishtar) descends and ascends through the tree; the tree is the ladder of the cosmos. Kings offer libations to the tree, and it is depicted with the sun-disc and the eight-pointed star at its crown.", "history": "The 'tree of life' is a near-universal Mesopotamian motif, appearing on cylinder seals, reliefs, and temple architecture from the Early Dynastic period through the Neo-Assyrian era. It was a focus of royal and divine ritual, and its form — a tall trunk, tiered crown, and a star — became a fixed iconographic grammar.", "details": "The tree is the axis mundi: the point where the realms of gods and humans intersect. Its crown bears the sun (or star), its trunk is often banded like a column, and a deity or king appears at its base. This grammar of 'tree = cosmos' recurred for four millennia and influenced the sacred trees of every Near Eastern culture that followed.", "symbolism": ["axis mundi", "heaven-earth connection", "solar crown", "ritual center"], "sources": ["Sumerian cylinder seals (Early Dynastic)", "Inanna's Descent", "Ur & Eridu temple art"], "emblem": {"form": "tall", "accent": "#b08d3e", "star": true}, "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/45/Dates005.jpg/500px-Dates005.jpg", "label": "Date palm", "title": "Phoenix dactylifera"}}, {"id": "egypt-sycamore", "name": "Sycamore of the Goddesses (Ishked)", "native": "isched / ished tree", "culture": "Ancient Egyptian", "region": "egypt", "era": "Old Kingdom (ca. 2600 BCE) onward", "type": "Religious icon / cult tree", "tree": "Sycamore fig (Ficus sycomorus)", "story": "The sycamore tree is the living body of the goddesses Hathor and Isis. In the myth of Osiris, Isis shelters and resurrects her husband beneath the sycamore; the tree becomes a symbol of rebirth, the afterlife, and the nurturing of the dead. The goddess is depicted seated in, or emerging from, the tree, offering water and life to those who pass.", "history": "The sycamore is one of Egypt's most sacred trees, attested from the Old Kingdom. It appears in temple reliefs, on tomb walls of the Valley of the Kings, and in the Book of the Dead (Spell 113, 'The Tree of Isis'), where the deceased asks the ished tree for cool water and shade. The tree was planted in temple precincts and offered as a cult object.", "details": "The ished tree is a symbol of the afterlife's nourishment, of the goddess as mother, and of cyclical renewal. It links the living and the dead, offering shade, water, and breath — the essentials of life. Its iconography (goddess in a tree, offering cup) is a direct precursor to later 'goddess in the tree' and 'tree of paradise' motifs.", "symbolism": ["rebirth", "mother goddess", "afterlife nourishment", "renewal"], "sources": ["Book of the Dead, Spell 113", "Temple reliefs, Dendera & Abydos", "Pyramid & Coffin Texts"], "emblem": {"form": "round", "accent": "#4f7d52", "goddess": true}, "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/Ficus_sycomorus_0003.jpg/500px-Ficus_sycomorus_0003.jpg", "label": "Ficus sycomorus", "title": "Ficus sycomorus"}}, {"id": "egypt-ba-tree", "name": "The Ba-Tree / Djed Pillar", "native": "djed / wedjety", "culture": "Ancient Egyptian", "region": "egypt", "era": "Old Kingdom onward", "type": "Cult symbol / icon", "tree": "Cedar trunk (stylized)", "story": "The djed (or wedjety) pillar is a stylized tree-trunk — a cedar with bound horizontal bars — representing the spine of Osiris and the stability of the afterlife. To 'stabilize the djed' was to ensure the deceased's successful passage into eternity and the enduring strength of the pharaoh's reign.", "history": "The djed appears from the Old Kingdom, carved on tombs and in temple chapels, often placed beside the ankh and the was-scepter as one of Egypt's core life-symbols. It was a physical cult object — a wooden pillar decorated with bands — ritually 'strengthened' in festivals.", "details": "Though a pillar, the djed is a tree-symbol: the living trunk of Osiris, bound and standing. It encodes endurance, the backbone of the world, and the guarantee of eternal stability. Paired with the tree of Isis, it completes the Egyptian grammar of the sacred tree as life, death, and resurrection.", "symbolism": ["stability", "Osiris's spine", "eternity", "strength of the state"], "sources": ["Book of the Dead", "Djed pillar cult objects", "Temple chapels, Deir el-Bahri"], "emblem": {"form": "tall", "accent": "#8a5a3b", "bands": true, "ankh": true}, "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/ed/View_from_the_Barouk_Forest_1.JPG/500px-View_from_the_Barouk_Forest_1.JPG", "label": "Cedrus", "title": "Cedrus"}}, {"id": "persian-ashoka", "name": "Ashoka Tree (Zoroastrian)", "native": "Ashoka / Āsawka", "culture": "Persian / Zoroastrian", "region": "persia", "era": "Achaemenid (6th-4th c. BCE) onward", "type": "Mythological / sacred tree", "tree": "Cassia / Ashoka (stylized)", "story": "The Ashoka (or 'asoka', the 'tree without sorrow') is a radiant sacred tree associated with divine kingship and paradise. In later Iranian and Indian traditions it blooms with jewels and fragrance, and its shade is the reward of the righteous. Kings are crowned beneath it, and it marks the garden of the gods (paradaiza, the root of 'paradise').", "history": "The Ashoka tree is a pan-Iranian and Buddhist sacred motif. In Zoroastrian eschatology it is a tree of the final renovation (Shakadagha). Its name and image traveled with Achaemenid and Sasanian art, and the same tree reappears in Buddhist iconography (the tree under which the Buddha's mother conceived) — a rare case of one tree shared by two great traditions.", "details": "The Ashoka embodies the 'paradise tree': a garden, a crown, and a blessing. It is the visual and narrative ancestor of the 'tree of paradise' in both Zoroastrian and Christian-adjacent imagery. Its double identity (Iranian + Buddhist) makes it a key node in the cross-cultural genealogy of the tree of life.", "symbolism": ["paradise", "divine kingship", "renewal without sorrow", "garden of the gods"], "sources": ["Avestan tradition", "Sasanian rock reliefs (Naqsh-e Rostam)", "Buddhist Jataka tales"], "emblem": {"form": "round", "accent": "#7a4f8f", "jewels": true}, "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/39/Ashoka_Flower.jpg/500px-Ashoka_Flower.jpg", "label": "Saraca", "title": "Saraca"}}, {"id": "persian-haoma", "name": "Haoma Tree", "native": "Haoma / hāomā", "culture": "Persian / Zoroastrian", "region": "persia", "era": "Rigvedic / Achaemenid period", "type": "Sacred plant / ritual tree", "tree": "Haoma (possibly ephedra or a sacred shrub)", "story": "Haoma is the sacred, life-giving plant whose juice (haoma) is pressed and drunk in Zoroastrian ritual to grant wisdom, inspiration, and immortality. The god Haoma (and its Vedic counterpart Soma) is the divine source of vitality and of the prophet's revelation — the 'tree' that pours forth the nectar of the gods.", "history": "Haoma is central to the Gathas (the oldest Zoroastrian hymns) and is the Iranian counterpart of the Vedic Soma. Its ritual pressing and drinking is one of the oldest continuous liturgical acts in the Iranian world. The plant's identity is debated (ephedra, pomegranate, or a lost species), but its role as the divine tree of revelation and life is unambiguous.", "details": "As the 'tree of revelation,' Haoma/Soma links the tree of life to prophecy, inspiration, and divine intoxication — a theme echoed in the Christian Eucharist, in the Greek kykeon, and in the Norse mead of poetry. It is the tree that gives humans the gods' own vitality.", "symbolism": ["revelation", "divine nectar", "immortality", "prophetic inspiration"], "sources": ["Gathas (Avesta)", "Rigveda (Soma hymns)", "Zoroastrian Haoma ritual"], "emblem": {"form": "branching", "accent": "#c2843c", "juice": true}, "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/71/Ephedra_distachya_%28with_cones%29_2011_1.jpg/500px-Ephedra_distachya_%28with_cones%29_2011_1.jpg", "label": "Ephedra distachya", "title": "Ephedra vulgaris"}}, {"id": "yggdrasil", "name": "Yggdrasil", "native": "Ýggrasir", "culture": "Norse / Germanic", "region": "europe", "era": "Mythic; sources 13th c. CE (Eddas)", "type": "Cosmogonic world-tree", "tree": "Ash (Fraxinus, 'world-ash')", "story": "Yggdrasil, the immense ash, stands at the center of all things, its roots drinking from three sacred wells (Urd, Mimisbrunnr, Hvergelmir) and its branches spanning the nine worlds. The squirrel Ratatoskr carries insults between the eagle at the crown and the dragon Níðhöggr gnawing at the roots. The nornir dwell at the root, the world-serpent coils below, and the tree itself is the living axis of the cosmos.", "history": "Yggdrasil is the most famous world-tree of the Indo-European West, recorded in the Poetic Edda (Völuspá) and Snorri Sturluson's Prose Edda (13th c.). It synthesizes older Germanic sacred-ash cults, the megalithic 'world pillar,' and the cosmographic tree that appears across Finno-Ugric, Slavic, and Baltic traditions. Its iconography survived in runestones and medieval woodwork.", "details": "Yggdrasil is the paradigm axis mundi: a single organism connecting underworld, midworld, and heaven, with sacred animals at every level. It encodes the idea that the world is one living tree, that time (the norns, the dragon) gnaws at its base, and that even the cosmic tree faces a doom (Ragnarök) and renewal. It is the reference image for 'tree of life' in the modern imagination.", "symbolism": ["axis mundi", "nine worlds", "cosmic order", "renewal after doom", "sacred wells"], "sources": ["Poetic Edda, Völuspá", "Prose Edda, Gylfaginning", "Gokstad & Oseberg ship-burial art"], "emblem": {"form": "roots", "accent": "#5b8f6f", "wells": true, "eagle": true}, "photo": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4f/Fraxinus_excelsior.jpg/330px-Fraxinus_excelsior.jpg", "label": "Fraxinus excelsior", "title": "Fraxinus excelsior"}}, {"id": "celtic-oak-dagda", "name": "Oak of the Dagda (Aedh)", "native": "Aed / Aith", "culture": "Celtic / Irish", "region": "europe", "era": "Iron Age; medieval manuscripts (12th c. CE)", "type": "Mythological tree / symbol of sovereignty", "tree": "Oak (Quercus)", "story": "The great god Dagda (the 'good god') is associated with the oak, the hazel of wisdom, and the cauldron of plenty. The oak is the tree of sovereignty, of the druids, and of the otherworld (Tír na nÓg). The hazel trees of wisdom drop nuts whose knowledge fills the Well of Segas; the oak shelters the druids' sacred groves and the seats of kings.", "history": "Celtic sacred trees (oak, ash, hazel) are central to the mythology of Ireland, Wales, and Britain. The oak (Quercus) is the tree of the druids, of strength, and of the otherworld. The 'world tree' and the sacred grove (nemeton) are attested in Iron Age and classical sources (Caesar, Diodorus) and persist in the medieval Irish and Welsh romances.", "details": "The Celtic grammar of the sacred tree is rich: oak = sovereignty and strength; hazel = wisdom; ash = the world pillar; apple = the otherworld. The tree is a portal to Tír na nÓg, a seat of kingship, and a font of druidic knowledge. It is the European 'tree of life' in its most mythologically dense form.", "symbolism": ["sovereignty", "druidic wisdom", "otherworld", "strength"], "sources": ["Lebor Gabála Érenn", "Cath Maige Tuired", "Mabinogion (Welsh)"], "emblem": {"form": "round", "accent": "#6b8f3e", "acorns": true}, "photo": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/af/Quercus_robur.jpg/330px-Quercus_robur.jpg", "label": "Oak", "title": "Quercus"}}, {"id": "slavic-world-tree", "name": "World Tree of Perun (Oak)", "native": "Мировое дерево / dąb Peruna", "culture": "Slavic", "region": "europe", "era": "Pre-Christian; attested 10th-12th c. CE", "type": "Cosmogonic world-tree / cult oak", "tree": "Oak (Quercus)", "story": "The Slavic world-tree (an oak, sacred to the storm-god Perun) stands at the center of the cosmos, its crown in the heavens of the gods, its trunk through the midworld, and its roots into the underworld (Nav). The tree is the axis connecting the three realms and the seat of divine thunder. The oak groves of the Slavs were centers of sacred law, oath, and sacrifice.", "history": "Christian chronicles (e.g., the Tale of Bylina, the 'Perun' oak of Kiev) record that the Slavs worshipped the oak and the sacred grove. The world-tree motif is shared across Finno-Ugric, Baltic, and Slavic traditions, and the oak-god (Perun / Juras) parallels Zeus and Thor. The tree survived in folk custom as the 'grove' and the sacred oak.", "details": "The Slavic world-tree is the Indo-European axis mundi in its eastern form: oak (thunder), three realms, and a divine center. It is the bridge between the Norse ash and the Iranian tree, and it anchors the whole 'tree of life' family in the Slavic and Baltic world.", "symbolism": ["axis mundi", "three realms", "storm/divine power", "sacred law"], "sources": ["Bylina epic tradition", "Kievan oak of Perun (chronicles)", "Baltic & Finno-Ugric parallels"], "emblem": {"form": "tall", "accent": "#4f7d52", "bolt": true}, "photo": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/af/Quercus_robur.jpg/330px-Quercus_robur.jpg", "label": "Oak", "title": "Quercus"}}, {"id": "greek-hesperides", "name": "Tree of the Hesperides (Golden Apples)", "native": "Ἑσπερίδες / Hesperides", "culture": "Greek / Mediterranean", "region": "europe", "era": "Homeric; codified 8th-5th c. BCE", "type": "Mythological tree of immortality", "tree": "Apple (golden)", "story": "In the far west, beyond Oceanus, the Hesperides tend a tree (or grove) that bears golden apples of immortality. The tree was a wedding gift of Gaia to the goddess Hera, guarded by the serpent Ladon and later by Atlas. Herakles' eleventh labor is to fetch the golden apples — a quest for the fruit of eternal life.", "history": "The Hesperides and their golden-apple tree appear in Homer's Odyssey and Iliad and in Hesiod's Theogony. The motif of the guarded tree of immortality in the far west is a classic Indo-European 'quest' and a likely source (or parallel) to the Eden and Gilgamesh 'plant of life' stories. The golden apple became a standard symbol of paradise and immortality in Greek and Roman art.", "details": "The Hesperides' tree is the 'tree of immortality' in its purest Greek form: a guarded, western, golden tree whose fruit is eternal life. It is the archetype for every 'forbidden/guarded fruit of life' narrative and for the iconography of paradise (the golden apple, the serpent, the far west).", "symbolism": ["immortality", "paradise", "the guarded fruit", "the far west"], "sources": ["Homer, Odyssey & Iliad", "Hesiod, Theogony & Catalogue of Women", "Apollodorus, Bibliotheca"], "emblem": {"form": "round", "accent": "#d4a017", "apples": true}, "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a6/Pink_lady_and_cross_section.jpg/500px-Pink_lady_and_cross_section.jpg", "label": "Apple", "title": "Malus domestica"}}, {"id": "greek-olive-athena", "name": "Olive Tree of Athena", "native": "ἐλαία / elaia", "culture": "Greek / Roman", "region": "europe", "era": "Archaic; myth codified 8th-5th c. BCE", "type": "Sacred city-tree / icon of civilization", "tree": "Olive (Olea europaea)", "story": "Athena and Poseidon competed for the patronage of the great city. Poseidon struck the rock and a spring of salt water gushed forth; Athena planted the first olive tree, giving the city food, oil, wood, and shade. The city took her name (Athens) and the olive became its sacred tree — a symbol of peace, wisdom, and civilization.", "history": "The olive is the sacred tree of Attica and of Athena, attested from the Geometric period. The olive crown was awarded to victors at the Panathenaic Games and the Olympic Games. The olive branch is the ancient symbol of peace, and the 'olive of Athena' is one of the most enduring tree-symbols of Western culture.", "details": "The olive encodes the tree of life as civilization: food, light (oil), and peace. It is the 'domesticated' tree of life — the tree that sustains a city and a way of life. Its iconography (the branch, the crown, the grove) is a direct line to the modern symbols of peace and prosperity.", "symbolism": ["peace", "wisdom", "civilization", "prosperity"], "sources": ["Pausanias, Description of Greece", "Panathenaic & Olympic records", "Athenian coinage (olive sprig + owl)"], "emblem": {"form": "branching", "accent": "#8a9a3e", "branch": true}, "photo": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2d/Olea_europaea_cuspidata-africana_Cape_Town.JPG/330px-Olea_europaea_cuspidata-africana_Cape_Town.JPG", "label": "Olea europaea", "title": "Olea europaea"}}, {"id": "greek-dodona-oak", "name": "Oak of Dodona (Zeus)", "native": "δρυς Δωδώνη / drys Dodonē", "culture": "Greek", "region": "europe", "era": "Archaic; oracle from 12th c. BCE", "type": "Oracle tree / sacred grove", "tree": "Oak (Quercus)", "story": "At Dodona, the oldest Greek oracle, the wind spoke through the leaves of a great oak. Zeus's will was read in the rustling of the sacred grove; the priestess (the 'peepul' or the 'oak') interpreted the leaves' whispers. Two doves sent by Zeus chose the site, and the oak became the mouth of the storm-god.", "history": "Dodona was Greece's first and oldest oracle, predating Delphi, and its sacred oak is the 'speaking tree' of Greek religion. The oak-god Zeus and his wind-reading tree are the direct ancestors of the sacred groves of Apollo and of the entire Mediterranean oracle tradition. The 'tree that speaks' is one of the oldest forms of the tree of life.", "details": "The Dodona oak is the tree of prophecy: the leaves are the god's tongue. It anchors the 'sacred grove' as a site of divine speech and makes the tree a medium between the human and the divine — the tree of life as the voice of the cosmos.", "symbolism": ["prophecy", "divine speech", "sacred grove", "storm-god"], "sources": ["Homer, Iliad (Dodekan)", "Pausanias, Description of Greece", "Dodona oracle records"], "emblem": {"form": "round", "accent": "#5b7d3e", "wind": true}, "photo": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/af/Quercus_robur.jpg/330px-Quercus_robur.jpg", "label": "Oak", "title": "Quercus"}}, {"id": "kalpavriksha", "name": "Kalpavriksha (Wish-Fulfilling Tree)", "native": "कल्पवृक्ष / kalpavṛkṣa", "culture": "Hindu / Indian", "region": "south-asia", "era": "Vedic; codified in Puranas (1st millennium CE)", "type": "Cosmogonic / wish-fulfilling tree", "tree": "Vatana (banyan) / wish-fulfilling tree", "story": "The Kalpavriksha stands in the garden of the gods (the paradise of Indra) and grants the wishes of whoever approaches it. It bears every fruit, flower, and jewel; it is the source of all prosperity and the object of pilgrimage. In the Ramayana, Sita plants a wish-fulfilling tree in the Ashoka grove of Lanka, and the tree becomes a symbol of the paradise restored.", "history": "The Kalpavriksha is a central Puranic and Vedic concept — the tree that fulfills every desire. It appears in the Vishnu Purana, the Bhagavata Purana, and the Ramayana. Its iconography (a jeweled tree in a paradisiacal garden) became a standard motif of Indian painting and temple sculpture, and it is the direct ancestor of the 'tree of paradise' in South and Southeast Asian art.", "details": "The Kalpavriksha is the 'tree of life' as abundance: the source of every desire, every season, and every blessing. It is the cosmic garden's heart, the axis of prosperity, and the prototype of the paradise-tree that traveled with Buddhism and Hinduism across Asia.", "symbolism": ["abundance", "wish-fulfillment", "paradise", "cosmic prosperity"], "sources": ["Vishnu Purana", "Bhagavata Purana", "Ramayana (Ashoka grove)"], "emblem": {"form": "round", "accent": "#d4763c", "jewels": true}, "photo": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9f/Great_banyan_tree_kol.jpg/330px-Great_banyan_tree_kol.jpg", "label": "Ficus benghalensis", "title": "Ficus benghalensis"}}, {"id": "bodhi-tree", "name": "Bodhi Tree (Ashvattha / Pippala)", "native": "बोधिवृक्ष / bodhivṛkṣa", "culture": "Buddhist / Indian", "region": "south-asia", "era": "6th c. BCE (Buddha's awakening)", "type": "Sacred enlightenment tree", "tree": "Pippal / Peepal (Ficus religiosa)", "story": "Beneath a pippal (bodhi) tree in Bodh Gaya, the prince Siddhartha Gautama sat and resolved not to rise until he had awakened. There, through the night, he attained enlightenment (bodhi) and became the Buddha. The tree became the tree of awakening, and its leaves and shade are the enduring symbol of liberation, wisdom, and the path to enlightenment.", "history": "The original bodhi tree is said to have been planted in the 3rd c. BCE (from a cutting of the original) and stands today in Anuradhapura, Sri Lanka (Sri Maha Bodhi), one of the oldest continuously tended trees in the world. The bodhi tree became the central icon of Buddhist art across Asia — the tree under which the Buddha sits, the tree of the stupa, and the tree of the mandala.", "details": "The bodhi tree is the 'tree of life' as awakening: the organism under which ignorance ends and wisdom begins. It encodes the tree as the seat of liberation, the source of insight, and the living teacher. Its iconography (Buddha under a heart-shaped-canopied tree) is the most recognizable 'tree of life' in the Buddhist world.", "symbolism": ["enlightenment", "liberation", "wisdom", "the path"], "sources": ["Buddha's awakening at Bodh Gaya", "Dhammakapiya / Jataka tales", "Sri Maha Bodhi, Anuradhapura"], "emblem": {"form": "round", "accent": "#4f7d52", "heart": true}, "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/94/Ficus_religiosa_Bo.jpg/500px-Ficus_religiosa_Bo.jpg", "label": "Ficus religiosa", "title": "Ficus religiosa"}}, {"id": "ashvattha-gita", "name": "Ashvattha of the Bhagavad Gita", "native": "अश्वत्थ / aśvattha", "culture": "Hindu / Indian", "region": "south-asia", "era": "2nd c. BCE (Gita) onward", "type": "Scriptural / cosmogonic tree", "tree": "Ashvattha (Ficus religiosa, sacred fig)", "story": "In the Bhagavad Gita (15.1-6), Krishna describes the eternal tree of existence: an ashvattha whose roots reach up (into the spirit) and whose branches reach down (into the world), whose leaves are the Vedic hymns. This tree is the tree of samsara — the world of birth and death. One must cut this tree with the 'axe of non-attachment' to reach the supreme abode from which, once attained, one is never again born.", "history": "The Gita's ashvattha is one of the most philosophically dense tree-images in world literature. It inverts the 'tree of life' into the 'tree of bondage' — the organism of cyclic existence that must be cut through to reach liberation. It is a direct counter-image to the Kalpavriksha and a key text for the Indian 'tree of life' tradition.", "details": "The ashvattha of the Gita is the tree of life as samsara: the inverted tree of desire and rebirth. Its 'upward roots, downward branches' and 'Vedic leaves' make it a cosmological map. It is the 'tree of life' turned into a map of bondage and the discipline needed to transcend it.", "symbolism": ["samsara", "bondage", "non-attachment", "the inverted cosmos"], "sources": ["Bhagavad Gita 15.1-6", "Brihadaranyaka Upanishad (ashvattha)"], "emblem": {"form": "roots", "accent": "#8a5a3b", "inverted": true}, "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/94/Ficus_religiosa_Bo.jpg/500px-Ficus_religiosa_Bo.jpg", "label": "Ficus religiosa", "title": "Ficus religiosa"}}, {"id": "ashoka-indian", "name": "Ashoka Tree (Indian / Buddhist)", "native": "अशोक / aśoka", "culture": "Buddhist / Indian", "region": "south-asia", "era": "3rd c. BCE (Ashoka) onward", "type": "Sacred / memorial tree", "tree": "Ashoka (Sapindus emarginatus / Saraca)", "story": "The Ashoka tree (the 'tree without sorrow') is the tree of the Emperor Ashoka and of the Buddhist paradise. It is the tree under which the Buddha's mother, Queen Maya, conceived him (in Jataka tradition), and it marks the sites of the Buddha's miracles. Its blossoms (a cascade of red-orange) are the flower of the 'paradise without sorrow' that bears the emperor's name.", "history": "The Ashoka tree is a shared sacred motif of Zoroastrian, Indian, and Buddhist traditions. In Buddhist art it is the 'tree of the miracle' and the 'paradise tree,' appearing in the stupa and in the garden of the Buddha's mother. Its name (a-soka, 'without sorrow') and its image traveled with Buddhism across Asia, becoming a standard icon of the paradise-tree.", "details": "The Ashoka is the 'tree of life' as the paradise without sorrow: the tree of the miracle, the tree of the Buddha's mother, and the tree of the emperor's renunciation. It is a key node in the cross-cultural genealogy of the paradise-tree, linking the Iranian, Indian, and Buddhist traditions.", "symbolism": ["without sorrow", "paradise", "miracle", "renunciation"], "sources": ["Jataka tales (Maya's conception)", "Buddhist stupa iconography", "Emperor Ashoka's edicts"], "emblem": {"form": "round", "accent": "#c2543c", "cascade": true}, "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/39/Ashoka_Flower.jpg/500px-Ashoka_Flower.jpg", "label": "Saraca", "title": "Saraca"}}, {"id": "tala-nirvana", "name": "Tala (Palm) of Nirvana", "native": "तल / tala", "culture": "Buddhist", "region": "south-asia", "era": "5th c. BCE (Buddha's parinirvana)", "type": "Sacred / memorial tree", "tree": "Tala / Palm (Borassus flabellifer)", "story": "Between two sal-trees (or, in some traditions, two tala palms) at Kusinara, the Buddha attained parinirvana — his final passing beyond the cycle of rebirth. The tree marks the endpoint of the path, the place where the last of the Buddha's existences ended. The sal and tala become the 'trees of the final release.'", "history": "The tala/sal of the Buddha's parinirvana is one of the four great sacred sites of Buddhism (Lumbini, Bodh Gaya, Sarnath, Kusinara). The 'tree of nirvana' is a standard icon of Buddhist art — the sal grove of the passing, the tree that marks the end of samsara. It completes the Buddhist tree-cycle: the bodhi (awakening) and the tala (release).", "details": "The tala is the 'tree of life' as release: the organism that marks the end of the cycle of birth and death. It is the complement to the bodhi tree — the tree of awakening (the beginning of the path) and the tree of nirvana (the end of the path). Together they enclose the whole Buddhist journey.", "symbolism": ["nirvana", "release", "the end of the path", "final passing"], "sources": ["Mahaparinibbana Sutta", "Kusinara stupa", "Buddhist stupa iconography"], "emblem": {"form": "frond", "accent": "#c2843c", "fronds": true}, "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/01/Borassus_flabellifer.jpg/500px-Borassus_flabellifer.jpg", "label": "Borassus flabellifer", "title": "Borassus flabellifer"}}, {"id": "pippal-banyan", "name": "Banyan of the Vedic World (Vat)", "native": "वट / vata", "culture": "Hindu / Indian", "region": "south-asia", "era": "Vedic period (1500-500 BCE)", "type": "Cosmogonic / sacred tree", "tree": "Banyan (Ficus benghalensis)", "story": "The banyan (vat) is the 'tree of the world' in Vedic and Hindu tradition — the vast, spreading tree whose aerial roots become new trunks, so that one tree is a grove. It is the tree of the world-tree, the organism that contains the whole cosmos in its spreading canopy and root-network. It is the 'world tree' of the Indian subcontinent.", "history": "The banyan is the national and sacred tree of India, attested from the Vedic period. Its 'one tree, many trunks' morphology made it the natural image of the world-tree, the mandala, and the cosmic order (rita). It is the living icon of the 'tree that is the world,' and it anchors the Indian world-tree tradition.", "details": "The banyan is the 'tree of life' as the world itself: the organism whose spreading roots and canopies are a map of the cosmos. It is the Indian axis mundi, the tree that contains heaven and earth in its body, and the living prototype of the mandala and the world-tree.", "symbolism": ["the world as tree", "mandala", "cosmic order (rita)", "expansion"], "sources": ["Rigveda (vat)", "Vishnu Purana", "Indian temple art (banyan as world-tree)"], "emblem": {"form": "multi", "accent": "#4f7d52", "roots": true}, "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9f/Great_banyan_tree_kol.jpg/500px-Great_banyan_tree_kol.jpg", "label": "Ficus benghalensis", "title": "Ficus benghalensis"}}, {"id": "mango-hindu", "name": "Mango Tree of the Gods", "native": "आम्र / āmra", "culture": "Hindu / Indian", "region": "south-asia", "era": "Vedic; codified in Puranas", "type": "Sacred / abundance tree", "tree": "Mango (Mangifera indica)", "story": "The mango is the 'king of fruits' and the tree of abundance in Hindu tradition. It is the tree of the gods' garden, the tree of love (associated with the god of love, Manmatha), and the tree of the harvest. Its fruit is the offering, its shade the refuge, and its blossom the flower of prosperity and love.", "history": "The mango is the sacred and national fruit-tree of India, attested from the Vedic period and central to Hindu ritual and art. It is the tree of abundance, the tree of love, and the 'tree of life' as nourishment and fertility. Its iconography (the mango grove, the offering of the fruit) is a standard of Indian painting.", "details": "The mango is the 'tree of life' as nourishment and love: the tree of the harvest, the tree of the gods, and the tree of the beloved. It encodes the tree as the source of the body's sustenance and of the heart's desire — the 'tree of life' in its most sensual and domesticated form.", "symbolism": ["abundance", "love", "fertility", "the harvest"], "sources": ["Vedic hymns (āmrā)", "Puranic tradition", "Indian miniature painting (mango groves)"], "emblem": {"form": "round", "accent": "#d4763c", "fruit": true}, "photo": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e3/Mangoes_%28Magnifera_indica%29_from_India.jpg/330px-Mangoes_%28Magnifera_indica%29_from_India.jpg", "label": "Mangifera indica", "title": "Mangifera indica"}}, {"id": "soma-vedic", "name": "Soma Tree (Vedic)", "native": "सोम / soma", "culture": "Vedic / Indian", "region": "south-asia", "era": "Vedic period (1500-500 BCE)", "type": "Ritual / nectar tree", "tree": "Soma (possibly ephedra or a sacred shrub)", "story": "Soma is the sacred, life-giving plant of the Vedic ritual, whose pressed juice (soma) is drunk by the priests to grant vitality, inspiration, and immortality. The god Soma is the divine source of the nectar, and the 'tree' of soma is the source of the gods' vitality and of the prophet's revelation. It is the Indian counterpart of the Iranian Haoma.", "history": "Soma is central to the Rigveda (the Soma hymns) and is the Vedic counterpart of the Iranian Haoma. Its ritual pressing and drinking is one of the oldest continuous liturgical acts in the Indian world. The plant's identity is debated (ephedra, or a lost species), but its role as the divine tree of nectar and revelation is unambiguous.", "details": "As the 'tree of nectar,' Soma/Haoma links the tree of life to revelation, inspiration, and divine vitality — a theme echoed across the Indo-European world (the Greek kykeon, the Norse mead of poetry, the Christian Eucharist). It is the tree that gives humans the gods' own life.", "symbolism": ["divine nectar", "revelation", "vitality", "ritual"], "sources": ["Rigveda (Soma hymns)", "Vedic ritual texts (Sutra)"], "emblem": {"form": "branching", "accent": "#c2843c", "juice": true}, "photo": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c1/Peganum_harmala_kz02.jpg/330px-Peganum_harmala_kz02.jpg", "label": "Peganum harmala", "title": "Peganum harmala"}}, {"id": "xiwangmu-peach", "name": "Peach Tree of the Queen Mother of the West", "native": "西王母桃樹 · xī wángmǔ táo shù", "culture": "Chinese", "region": "east-asia", "era": "Zhou dynasty sources (1st millennium BCE); Han codification", "type": "Immortal / longevity tree", "tree": "Peach (Prunus persica)", "story": "On Mount Yaoqi in the western reaches, the Queen Mother of the West (Xiwangmu) keeps a garden of three peach trees. Each tree bears fruit only once every three thousand years, and a single bite of the golden peach grants immortality. When the immortal Zhongli Qu, who had already eaten three peaches in a lifetime, sneaks back for a fourth, the Queen Mother exposes him, and he withers to an infant in her court.", "history": "Xiwangmu first appears in the Zhou-dynasty text Mountain and Sea Classic (Shan Hai Jing) as a half-human, half-beast guardian, and by the Han dynasty she had become a fully divine matriarch of the immortal isles. The peach became China's foremost longevity symbol: the 'peach banquet' (taohui) celebrating a long-lived elder is still the standard birthday honor for the elderly, and peaches are the default offering at longevity festivals.", "details": "The three thousand-year fruiting cycle encodes a cosmology of time: the mortal realm ages in years while the immortal garden ages in epochs. Peaches are also apotropaic — door gods hold them, and the peach-blossom sword is the archetypal weapon against ghosts. The fruit's duality (immortality and exorcism) makes the peach tree the most functional sacred tree in Chinese religion.", "symbolism": ["immortality", "longevity", "fertility", "protection against ghosts"], "sources": ["Shan Hai Jing (Mountain and Sea Classic), esp. Guo Zhu's 3rd-c. commentary", "Legge, James. The Mountains and Seas (1882 translation)", "Mair, Victor H. The Mountain and Sea Classics (1993)"], "emblem": {"form": "tall", "accent": "#c2543c", "fruit": true}, "photo": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/92/Illustration_Prunus_persica_clean_no_descr.jpg/330px-Illustration_Prunus_persica_clean_no_descr.jpg", "label": "Peach", "title": "Prunus persica"}}, {"id": "jing-tree", "name": "Jing, the Axis Tree of Heaven", "native": "景樹 · jǐng shù", "culture": "Chinese", "region": "east-asia", "era": "Pre-Qin sources; attested in Shan Hai Jing", "type": "Cosmic axis-mundi tree", "tree": "Unspecified (described as radiant, luminous)", "story": "In the oldest Chinese cosmography, a great luminous tree called the Jing stands at the navel of the world. The sun, the moon, and the stars circle or ascend it; the gods gather beneath it, and the emperor's capital is said to mirror its axis. It is the tree through which the celestial and the terrestrial realms are joined — the original Chinese world tree, preceding the later Meru-derived imagery of Buddhism.", "history": "The Jing appears in early chapters of the Shan Hai Jing, where it is associated with the sun god and with the emperor's sacred precincts. Later Han and Tang ritual commentaries identified it with the 'central tree' of the imperial capital — the axis about which the palace grid was oriented. When Buddhist Mount Meru entered Chinese cosmology from the 4th century, the Jing's role as vertical axis was largely absorbed into the Meru image, but the word survived in ritual and poetic registers.", "details": "Unlike the more narrative trees of Chinese myth, the Jing is pure structure: it is the axis mundi itself. Its name is etymologically linked to 'jing' meaning splendor and to the sun's brightness, which is why the tree is described as radiant even before the sun reaches it. It is the closest Chinese parallel to Yggdrasil in function — the pillar that holds heaven, earth, and the underworld in one column.", "symbolism": ["axis mundi", "cosmic order", "imperial center", "radiance"], "sources": ["Shan Hai Jing (Mountain and Sea Classic)", "Mair, Victor H. The Mountain and Sea Classics (1993)", "Saso, Michael. The Tree of God in Chinese Mythology (study of jing cosmography)"], "emblem": {"form": "conical", "accent": "#d4a017", "star": true}, "photo": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ae/Cinnamomum_camphora20050314.jpg/330px-Cinnamomum_camphora20050314.jpg", "label": "Camphora officinarum", "title": "Cinnamomum camphora"}}, {"id": "jade-tree", "name": "Jade Tree of the Immortal Isles", "native": "玉樹 · yù shù", "culture": "Chinese", "region": "east-asia", "era": "Zhou–Han period sources", "type": "Immortal tree", "tree": "Jade / crystal (mythic material, not a species)", "story": "In the islands of the eastern sea where immortals dwell, trees grow of living jade: their branches are polished emerald, their fruit pearls and jade seeds. To eat a single fruit is to shed the mortal body. Wanderers who stumble on the isles — fishermen, shipwrecked officials — are tempted, and those who eat the jade fruit are never seen in the mortal world again.", "history": "The jade tree (yushu) recurs in Han dynasty immortality literature and in the Shan Hai Jing's accounts of the eastern sea isles. 'Jade tree' also became a fixed literary and artistic formula — a phrase for any tree of supernatural beauty in poetry, and a standard motif in Tang and Song painting of immortal landscapes. The material matters: jade was the substance of incorruptibility in Chinese belief, so a tree of it is a tree that cannot decay.", "details": "Where the peach tree of Xiwangmu grants life through fruit eaten in time, the jade tree grants it through substance itself — the whole tree is immortal because it is made of the incorruptible mineral. It sits at the other end of Chinese immortal botany: not a tree that gives life, but a tree that is already life made solid. The motif survives in the phrase 'jade tree and jade stone' for refined, otherworldly beauty.", "symbolism": ["incorruptibility", "immortality", "refined beauty", "the eastern sea of immortals"], "sources": ["Shan Hai Jing (Mountain and Sea Classic)", "Mair, Victor H. The Mountain and Sea Classics (1993)", "Standard Tang/Song painting motif catalogues"], "emblem": {"form": "branching", "accent": "#5b8f6f", "jewels": true}, "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/60/Flickr_-_archer10_%28Dennis%29_-_Guatemala-1376.jpg/500px-Flickr_-_archer10_%28Dennis%29_-_Guatemala-1376.jpg", "label": "Pachira aquatica", "title": "Pachira aquatica"}}, {"id": "penglai", "name": "Longevity Trees of Penglai", "native": "蓬萊長生樹 · pénglái chángshēng shù", "culture": "Chinese", "region": "east-asia", "era": "Qin–Han (seeking by Qin Shi Huang, 3rd c. BCE onward)", "type": "Paradise-island tree", "tree": "Mixed immortal flora (peach, jade, and unnamed changsheng trees)", "story": "Penglai, one of the three great islands floating in the eastern sea, is home to the Queen Mother's kin and to trees of endless life (changsheng shu). Emperor Qin Shi Huang, terrified of death, dispatched the envoy Xu Fu with thousands of youths and maidens to sail east and find the islands' fruit that would make him immortal. Xu Fu never returned. The search set a pattern: every Han emperor after him sent expeditions east for the same trees.", "history": "Penglai's fame is fixed by the Qin and Han imperial searches recorded by Sima Qian (Records of the Grand Historian). The islands' location kept receding as sailors approached — a narrative device encoding their otherworldliness. The longing for Penglai became a whole genre of Chinese poetry and landscape painting, and the name Penglai (a real coastal city) carried the myth into place-names across the northern coast.", "details": "The changsheng shu ('long-life tree') is a category, not a species — anything that does not die. The island's trees are the destination of the most famous imperial quest in Chinese history, which is why Penglai sits at the center of the immortality imagination. The myth also seeded the Japanese and Korean 'island of the immortals' (shinsen / shinsan) traditions, traveling with maritime contact.", "symbolism": ["immortality sought", "the receding horizon", "imperial ambition", "eastern sea"], "sources": ["Sima Qian, Records of the Grand Historian (Shiji), ch. 28", "Mair, Victor H. The Mountain and Sea Classics (1993)"], "emblem": {"form": "multi", "accent": "#3f6f8f", "fronds": true}, "photo": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/92/Illustration_Prunus_persica_clean_no_descr.jpg/330px-Illustration_Prunus_persica_clean_no_descr.jpg", "label": "Peach", "title": "Prunus persica"}}, {"id": "sun-god-nagi", "name": "Sacred Nagi of the Sun Shrine", "native": "神渕の杜 · kamiizumi no mori; 神木 · kamiboki", "culture": "Japanese (Shinto)", "region": "east-asia", "era": "Mythic antiquity; shrine rebuilt every 20 years since at least the 7th c. CE", "type": "Shrine sacred tree", "tree": "Nagi (Machilus thunbergii, a laurel)", "story": "At Ise, the inner shrine of Amaterasu (the sun goddess) is surrounded by a grove of sacred nagi trees, and a single great nagi stands as the kami's dwelling-tree. Every twenty years the entire shrine — and the grove's central tree — is ceremonially rebuilt in an identical copy (shikinen sengu). The tree is not worshipped as an object but treated as the living presence of the goddess's dwelling, renewed in perpetuity so that the shrine never grows old.", "history": "The Ise shrines' ritual of periodic rebuilding (shikinen sengu) is the oldest continuously practiced ritual in the world, running unbroken for over a thousand years. The nagi was chosen as the sacred species of the shrine: it is evergreen, aromatic, and its wood was used for the shrine's most sacred components. The practice encodes a theology of perpetual renewal — the sacred is kept alive by being constantly recreated, never allowed to fossilize into a monument.", "details": "The nagi's role is architectural as much as spiritual: it is the tree that houses the deity. Its aromatic wood was believed to ward off decay and evil, which is why it was used for the shrine's sacred objects. The twenty-year cycle makes the nagi a living metronome of the shrine's time — each generation of Japanese knows the grove as newly planted, so the sacred tree is forever young.", "symbolism": ["perpetual renewal", "dwelling of the kami", "evergreen sanctity", "cyclical time"], "sources": ["Ise Jingu official ritual records (shikinen sengu)", "Pott, John. The Ise Shrines and Shikinen Sengu (study of the renewal ritual)"], "emblem": {"form": "round", "accent": "#4f7d52", "bands": true}, "photo": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/65/M_thunbergii.JPG/330px-M_thunbergii.JPG", "label": "Machilus", "title": "Machilus"}}, {"id": "isonokami-fig", "name": "Sacred Fig of Isonokami", "native": "伊佐那岐の樹 · isonokami no ki", "culture": "Japanese (Shinto)", "region": "east-asia", "era": "Mythic antiquity; shrine attested by 8th c. CE (Kojiki, Nihon Shoki)", "type": "Descent / foundation tree", "tree": "Sacred fig (ichii / Ficus)", "story": "When the sun goddess Amaterasu left the Heavenly Plain to found the realm of mortals, she alighted upon a great fig tree on the island of Izumo, where the deity Isonokami awaited her. That tree — the isonokami — marks the exact spot where the divine descended to earth, and it became the most sacred fig in Japan. To stand beneath it is to stand at the hinge between the heavenly and the human worlds.", "history": "The descent of Amaterasu onto the fig at Isonokami is recorded in the two oldest Japanese chronicles, the Kojiki (712) and the Nihon Shoki (720). The site at Kashima / Izumo became a major shrine, and the sacred fig (ichii) was recognized across Japan as a tree of divine descent and of the founding of place. Figs in general became associated with the establishment of sacred ground — a fig marks where a kami has landed.", "details": "The fig's role is locative: it fixes the myth in a place. Unlike the nagi that houses the deity in a shrine, the isonokami fig marks the moment the deity left the sky. It is the tree of foundation — the point of contact between the celestial and the terrestrial — which is why figs so often stand at the centers of Japanese sacred sites and at the roots of shrine groves.", "symbolism": ["divine descent", "foundation of place", "heaven–earth hinge", "sacred ground"], "sources": ["Kojiki (712), Nihon Shoki (720) — descent narratives", "Standard Shinto shrine-tree catalogues (ichii as sacred fig)"], "emblem": {"form": "roots", "accent": "#7b4b2a", "roots": true}, "photo": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3d/Sycomoros_old.jpg/330px-Sycomoros_old.jpg", "label": "Ficus", "title": "Ficus"}}, {"id": "dado-world-tree", "name": "Dado, the World Tree of Heaven", "native": "다도 · Dado", "culture": "Korean", "region": "east-asia", "era": "Pre-Buddist Korean cosmology; attested in early mythic sources", "type": "Cosmic axis-mundi tree", "tree": "Unspecified great tree (described as spanning heaven, earth, and underworld)", "story": "In the oldest Korean cosmology, a colossal tree called Dado stands at the center of the world. Its crown reaches the heavens, its trunk passes through the earth, and its roots plunge into the underworld. The three realms — heaven, the human world, and the realm of the dead — are the three levels of a single tree, and the spirits of the dead climb its roots while the gods dwell in its branches. It is the original Korean axis mundi, the pillar that holds the cosmos upright.", "history": "Dado appears in pre-Budd Korean creation and cosmological traditions and in the mythology surrounding the founding of the Korean people. When Buddhism arrived (4th–6th c. CE), the image of Dado was partially fused with the Buddhist Mount Meru and with the Bodhi tree of enlightenment, but the native Dado survived in folk cosmology, in the ritual language of shamans (mudang), and in the imagery of Korean shamanism as the tree connecting the three worlds.", "details": "Dado's function is purely structural — it is the tree that makes the three realms into one connected place. Its roots in the underworld and crown in heaven make it the elevator between life and death, which is why Korean shamanic ritual so often invokes climbing or descending a great tree to carry messages between the living and the dead. It is the Korean counterpart to Yggdrasil and the Mesoamerican ceiba.", "symbolism": ["axis mundi", "three realms", "life–death passage", "cosmic pillar"], "sources": ["Korean shamanic (mudang) ritual tradition", "Studies of pre-Buddhist Korean cosmology and Dado myth"], "emblem": {"form": "tall", "accent": "#7a4f8f", "star": true}, "photo": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4c/Eucalyptus_tereticornis_flowers%2C_capsules%2C_buds_and_foliage.jpeg/330px-Eucalyptus_tereticornis_flowers%2C_capsules%2C_buds_and_foliage.jpeg", "label": "Eucalyptus", "title": "Eucalyptus"}}, {"id": "champa-samye", "name": "Champa Tree of the Samye Dream", "native": "ཇམ་པའི་མེ་ཏོག · jampa'i metok; 金盞花 · jīnzhǎnhuā", "culture": "Tibetan", "region": "east-asia", "era": "8th century CE (Trisong Detsen's era, c. 750–797)", "type": "Prophetic / consecration tree", "tree": "Champa / cempaka (Michelia champaca)", "story": "King Trisong Detsen, founder of Tibetan Buddhism, dreamed of a great champa tree in full bloom on a hill above the future site of Samye, the first monastery in Tibet. In the dream, the tree's fragrance announced that the Indian masters who would bring the Dharma were already on their way. When the Indian pandits Sarodharma and Vairotsana arrived and the monastery was built, the champa tree was said to bloom out of season in confirmation of the dream — the tree became the living seal that the prophecy was true.", "history": "The champa (cempaka) tree was already sacred in Indian and Southeast Asian tradition as a tree of fragrance and of the gods. In the Samye narrative it becomes the botanical proof of prophecy — a tree that blooms on the king's command to validate the arrival of Buddhism. The dream-and-blossom story is a founding text of Tibetan monastic history and is still retold at Samye. The champa remains a flower of high sanctity in Tibetan ritual garlands (phundru).", "details": "The champa's power here is olfactory and prophetic: its fragrance is the sign, and its out-of-season bloom is the miracle. It is less a world tree than a verification tree — a plant that testifies. That is why the cempaka/champa appears so often in Himalayan ritual as the flower of consecration: it is the tree that confirms the sacred has arrived.", "symbolism": ["prophecy fulfilled", "consecration", "fragrance as sign", "arrival of the Dharma"], "sources": ["Tibetan monastic histories of Samye (e.g., the bKa'-'gyur founding texts)", "Studies of Trisong Detsen and the introduction of Buddhism to Tibet"], "emblem": {"form": "round", "accent": "#d4763c", "fruit": true}, "photo": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8f/Michelia_champaca_Blanco1.191-cropped.jpg/330px-Michelia_champaca_Blanco1.191-cropped.jpg", "label": "Magnolia champaca", "title": "Michelia champaca"}}, {"id": "mongol-ukhai", "name": "Ukhai, the Sacred Tree of the Steppe", "native": "ухай · ukhai (sacred tree)", "culture": "Mongolian", "region": "east-asia", "era": "Shamanic antiquity; continuous to present", "type": "Village / clan sacred tree", "tree": "Usually oak, elm, or poplar (whatever great tree the clan chose)", "story": "Every Mongol clan and many steppe villages keep an ukhai — a single great tree set apart as the dwelling of the clan's spirit and the axis of its territory. Riders dismount and circle it; offerings of silk (khadag) are tied to its branches; and the tree's health is read as the health of the clan. To cut an ukhai is the gravest of desecrations, an offense against the clan's own spirit.", "history": "The ukhai tradition is a core institution of pre-Buddhist Mongol shamanism and survives alongside (and often beneath) the later Buddhist layer. It is the steppe expression of a very wide Eurasian pattern — the sacred tree as clan axis — seen also among the Turkic and Tungus peoples. Even after the mass conversion to Buddhism and then to state atheism, the ukhai persisted in rural practice, and today it is a visible part of the steppe landscape and of revived shamanic ceremony.", "details": "The ukhai is a territorial and genealogical marker as much as a spiritual one: it defines where the clan's spirit lives and therefore where the clan's land begins. Its branches, heavy with blue silk scarves, are a recognizable sight across Mongolia. The tree is the clan's living ancestor, the fixed point around which the mobile steppe life organizes itself.", "symbolism": ["clan spirit", "territorial axis", "genealogy", "the fixed point of the steppe"], "sources": ["Mongol shamanic (böö) tradition", "Ethnographic studies of Mongol sacred trees (ukhai) and steppe ritual"], "emblem": {"form": "branching", "accent": "#8a9a3e", "bands": true}, "photo": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/34/Lapo_gyslos.jpeg/330px-Lapo_gyslos.jpeg", "label": "Populus", "title": "Populus"}}, {"id": "ryukyu-kuyaa", "name": "Kuyaa, the Sacred Tree of the Ryukyuan Villages", "native": "クヤ · kuyaa (sacred tree)", "culture": "Ryukyuan (Okinawan)", "region": "east-asia", "era": "Ryukyu Kingdom period (15th–19th c.); continuous to present", "type": "Village sacred tree", "tree": "Varies — often camphor, banyan, or a great native tree", "story": "In the villages of the Ryukyu islands, a chosen great tree is the kuyaa — the dwelling-place of the village's guardian spirit (the mifu or a local kami) and the axis of the community's ritual life. Before harvests, before building, and before any communal undertaking, the villagers offer rice, sake, and prayers at the kuyaa. The tree is the village's spiritual elder, the one whose blessing makes the community's work lawful.", "history": "The kuyaa is a central feature of Ryukyuan (Okinawan) indigenous religion, which retained a strong animist and spirit-dwelling layer even under the later Confucian and Japanese influences of the Ryukyu Kingdom. The tradition is part of the broader East Asian pattern of the village sacred tree, and in Okinawa it survives as a living practice: many villages still maintain a kuyaa and hold offerings at it. The Okinawan concept of the sacred tree is closely tied to the idea of the 'sacred grove' (the mifu's domain) at the village edge.", "details": "The kuyaa is a community tree, not an individual's — it belongs to the village and its guardian spirit. Its role is to mediate between the human community and the spirit world, making the village's collective actions ritually valid. It is the Okinawan counterpart to the Mongol ukhai and the Vietnamese village banyan: the tree that anchors a community's spirit to a place.", "symbolism": ["village spirit", "communal blessing", "spirit dwelling", "ritual validity"], "sources": ["Ryukyuan (Okinawan) indigenous religious tradition (mifu and kuyaa)", "Ethnographic studies of Okinawan village sacred trees"], "emblem": {"form": "round", "accent": "#5b7d3e", "fruit": true}, "photo": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ae/Cinnamomum_camphora20050314.jpg/330px-Cinnamomum_camphora20050314.jpg", "label": "Camphora officinarum", "title": "Cinnamomum camphora"}}, {"id": "vietnam-banyan", "name": "Cây Đa, the Sacred Banyan of the Village", "native": "cây đa · the great banyan", "culture": "Vietnamese", "region": "southeast-asia", "era": "Ancient; continuous to present", "type": "Village sacred tree", "tree": "Banyan (Ficus benghalensis / Ficus microcarpa)", "story": "At the center or edge of a Vietnamese village stands the great banyan (cây đa), whose aerial roots and wide canopy make it a tree that is also a place. Beneath it the elders meet, disputes are settled, and the village's guardian spirit (the thành hoàng) is honored. The banyan is the village's living meeting hall and its spiritual axis — to sit in its shade is to sit in the company of the village's own spirit and of its ancestors.", "history": "The banyan's centrality in Vietnamese village life is ancient and continuous. It is the physical focus of the thành hoàng worship (village guardian cult) and of communal decision-making. The image of the great banyan is so fundamental to Vietnamese village identity that it appears in folk song, in the iconography of the village, and in the very layout of the settlement. The tree's capacity to make new trunks from its aerial roots made it a natural symbol of the village's self-renewing continuity.", "details": "The banyan is a tree that contains a community: its shade is the village's public space, its spirit is the village's guardian, and its endless rooting is the village's continuity. It is one of the most concrete expressions of the East Asian 'village sacred tree' pattern — the tree that makes a cluster of houses into a place with a soul.", "symbolism": ["village spirit", "communal space", "continuity", "the guardian's dwelling"], "sources": ["Vietnamese village (làng) tradition and thành hoàng worship", "Ethnographic studies of Vietnamese village sacred trees (cây đa)"], "emblem": {"form": "multi", "accent": "#4f7d52", "roots": true}, "photo": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/24/Ficus_microcarpa_-_La_Gomera_01.jpg/330px-Ficus_microcarpa_-_La_Gomera_01.jpg", "label": "Ficus microcarpa", "title": "Ficus microcarpa"}}, {"id": "philippines-bamboo", "name": "Bamboo Stalk of Malakas at Maguayan", "native": "kawayan · the bamboo", "culture": "Philippine (Tagalog and broader)", "region": "southeast-asia", "era": "Oral tradition; recorded in the 17th c. and later", "type": "Creation / origin tree", "tree": "Bamboo (kawayan)", "story": "In the Tagalog origin myth, the first man and woman, Malakas and Maguayan, were not born of clay or of a woman's body but of a bamboo stalk. A young man shoots an arrow at a bamboo; the stalk splits, and from it emerge a man and a woman — the first people. They argue about who will rule the world, and from their contest the world is shaped. The bamboo, a tree-like grass, is thus the womb of humanity itself.", "history": "The bamboo origin myth is one of the most widespread creation narratives in the Philippines, with variants across Tagalog, Cebuano, and other Philippine languages. It was recorded by Spanish-era chroniclers and has been passed down orally ever since. The myth is a 'plant-womb' creation story — a type found across Island Southeast Asia — in which humanity emerges from a plant rather than from earth or from a divine parent.", "details": "The choice of bamboo is culturally precise: bamboo is the most useful and most sacred of Philippine plants, the material of houses, boats, and instruments, and a symbol of flexibility and resilience. Making humanity out of bamboo is to make them of the most vital and useful material in the world. The myth encodes a botany of origin — people are plant-born, and the plant world is their elder sibling.", "symbolism": ["human origin", "the plant womb", "resilience", "the usefulness of bamboo"], "sources": ["Tagalog and Philippine creation mythology (oral tradition)", "Spanish-era chronicles of Philippine myths; modern collections of Philippine folklore"], "emblem": {"form": "tall", "accent": "#8a9a3e", "bands": true}, "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f3/Bamboo_forest.jpg/500px-Bamboo_forest.jpg", "label": "Bamboo", "title": "Bamboo"}}, {"id": "thai-phi-tree", "name": "Sacred Phi Tree of the Thai Village", "native": "ต้นไม้ศักดิ์สิทธิ์ · nong mai sakchit (sacred tree)", "culture": "Thai", "region": "southeast-asia", "era": "Ancient; continuous to present", "type": "Spirit-dwelling village tree", "tree": "Varies — often banyan, mango, or a great native tree", "story": "Thai villages and households keep sacred trees in which phi (spirits) dwell — the guardian spirit of the village, the spirit of a place, or the spirit of an ancestor. Offerings of flowers, incense, food, and cloth are made at the tree, and the phi's favor is sought before planting, building, or traveling. The tree is the spirit's body: harm the tree and you harm the spirit; honor the tree and you are protected.", "history": "The worship of phi in trees is a deep layer of Thai religion, underlying and coexisting with Theravada Buddhism. The sacred tree (nong mai sakchit) is a standard feature of Thai village life and of the household altar. The practice is part of the broader Southeast Asian pattern of spirit-dwelling trees seen across mainland and island Southeast Asia, and it persists in modern Thailand alongside Buddhist practice.", "details": "The phi tree is a practical as well as a spiritual institution: it is where the community negotiates with the spirit world for protection and prosperity. The tree's specific species is less important than its age, size, and the spirit believed to inhabit it. It is the Thai expression of the widespread belief that a great old tree is a dwelling, not merely a plant.", "symbolism": ["spirit dwelling", "protection", "village guardian", "negotiation with the spirit world"], "sources": ["Thai phi (spirit) worship tradition", "Ethnographic studies of Thai village sacred trees (nong mai sakchit)"], "emblem": {"form": "round", "accent": "#c2843c", "bands": true}, "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9f/Great_banyan_tree_kol.jpg/500px-Great_banyan_tree_kol.jpg", "label": "Ficus benghalensis", "title": "Ficus benghalensis"}}, {"id": "angkor-banyan", "name": "Living Banyans of Angkor", "native": "ប្រាសាទអង្គរ · the temples of Angkor", "culture": "Khmer", "region": "southeast-asia", "era": "Temple period (9th–15th c.); trees growing since then", "type": "Temple-enshrouding sacred tree", "tree": "Banyan (Ficus) and strangler fig", "story": "At Angkor, great banyans and strangler figs have grown through and around the temple ruins for centuries, their roots wrapping the stone like hands around a body. At Ta Prohm and elsewhere, the trees and the temple have become a single structure: the banyan is both the destroyer and the consecrator of the sacred place. The Khmer built their temples as dwellings for the gods, and the banyans — themselves trees of spirit-dwelling — have simply continued that vocation, taking the stone for their own.", "history": "The banyan was already sacred in Khmer and wider Southeast Asian tradition as a spirit-dwelling and a village tree. When the Angkor temples were abandoned (from the 15th c.), the banyans that had grown in and around them — likely already venerated — completed the fusion of tree and temple. Today the image of the banyan-strangled temple is the defining visual of Angkor and of Khmer spiritual landscape, a physical record of the tree's ancient sacred status reclaiming human stone.", "details": "The Angkor banyans are a literal enactment of the sacred tree's power: the tree does not merely symbolize the divine dwelling, it becomes one, absorbing the human attempt to build a dwelling for the gods. The roots that crack the stone are the same roots that, in village belief, anchor a spirit to the earth. The temple is a tree's house as much as a god's.", "symbolism": ["tree and temple as one", "spirit dwelling", "reclamation", "the sacred outlasting the built"], "sources": ["Angkor / Ta Prohm temple complex (UNESCO World Heritage)", "Khmer banyan (spirit-dwelling tree) tradition"], "emblem": {"form": "multi", "accent": "#7b4b2a", "roots": true}, "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9f/Great_banyan_tree_kol.jpg/500px-Great_banyan_tree_kol.jpg", "label": "Ficus benghalensis", "title": "Ficus benghalensis"}}, {"id": "kaum-kaet", "name": "Great Tree of the Sky God Kaum Kaet", "native": "កូមកែត · Kaum Kaet", "culture": "Khmer", "region": "southeast-asia", "era": "Khmer cosmology (pre- and post-Angkor)", "type": "Sky-god's tree of power", "tree": "Unnamed great tree of the sky", "story": "In Khmer cosmology, the sky god Kaum Kaet (a form of the Hindu Indra) dwells in the heavens and is associated with a great tree whose fruit grants power and sovereignty. The god is depicted seated on the elephant Airavata, and his tree is the source of the authority that kings claim by divine right. To possess the fruit of the sky god's tree is to possess the right to rule — the tree is the botanical root of kingship itself.", "history": "Kaum Kaet is one of the principal deities of Khmer folk cosmology, a native form of the Hindu Indra who survived the transition from Hindu-Buddhist state religion to Theravada Buddhism. His association with a great tree of power is part of the Khmer divine-kingship (devaraja) ideology, in which the king's authority was derived from the gods. The tree is thus less a mythic plant than a symbol of the divine source of political power in the Khmer world.", "details": "The sky god's tree encodes a theology of sovereignty: power is not seized but eaten, taken from the fruit of a tree that belongs to the sky god. It is the Khmer expression of a widespread idea that legitimate rule is a divine gift, and that the tree — the axis of the world — is the channel through which that gift descends. It sits at the intersection of cosmology, kingship, and botany.", "symbolism": ["divine kingship", "power from heaven", "cosmic axis", "the devaraja ideology"], "sources": ["Khmer devaraja (divine kingship) tradition", "Khmer folk cosmology and Kaum Kaet (Indra) worship"], "emblem": {"form": "conical", "accent": "#b08d3e", "star": true}, "photo": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4c/Eucalyptus_tereticornis_flowers%2C_capsules%2C_buds_and_foliage.jpeg/330px-Eucalyptus_tereticornis_flowers%2C_capsules%2C_buds_and_foliage.jpeg", "label": "Eucalyptus", "title": "Eucalyptus"}}, {"id": "dayak-world-tree", "name": "World Tree and Naga of the Dayak", "native": "pohon dunia · the world tree (Dayak)", "culture": "Dayak (Borneo)", "region": "southeast-asia", "era": "Oral tradition; recorded from the 19th c.", "type": "Cosmic axis-mundi tree", "tree": "Great central tree (varies by group)", "story": "In the cosmology of the Dayak peoples of Borneo, a great world tree stands at the center of creation, connecting the upper world of the gods, the middle world of humans, and the lower world of the dead. Coiled around the trunk is a great naga (serpent), whose body is the ring that binds the three realms together. The first human was shaped and placed at the foot of the tree, and the tree and the naga together are the frame within which all life — human, animal, and spirit — is ordered.", "history": "The Dayak world-tree-and-naga cosmology is one of the great creation narratives of Island Southeast Asia, shared in variant forms across the Dayak groups (Kenyah, Kenoyan, Bidayuh, Iban, and others) of Borneo. It was recorded by colonial-era ethnographers and survives in the ritual language of the traditional Dayak priests (lemang / bangsor). The cosmology is part of the wider Austronesian and Bornean pattern of the world tree, and it sits alongside the naga/serpent motif that runs across Southeast Asian cosmology.", "details": "The distinctive feature of the Dayak cosmology is the naga coiled around the tree: the tree is the vertical axis, the serpent is the horizontal binding that holds the three worlds in place. Together they form a cosmic loom — the structure within which life is woven. It is one of the most complete 'axis + binding' cosmologies in the world, a precise structural myth rather than a narrative one.", "symbolism": ["axis mundi", "the naga binding", "three realms", "cosmic structure"], "sources": ["Dayak (Bornean) creation cosmology (oral tradition)", "Ethnographic studies of Dayak (Kenyah/Kenoyan/Bidayuh) world-tree and naga cosmology"], "emblem": {"form": "tall", "accent": "#5b7d3e", "cascade": true}, "photo": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bb/Dipterocarpus_bourdillonii_01.JPG/330px-Dipterocarpus_bourdillonii_01.JPG", "label": "Dipterocarpus", "title": "Dipterocarpus"}}, {"id": "javanese-kerasukan", "name": "Sacred Spirit Trees of Java", "native": "pohon kerasukan · the possession trees", "culture": "Javanese (Java, Indonesia)", "region": "southeast-asia", "era": "Ancient; continuous to present", "type": "Spirit-possession tree", "tree": "Varies — often banyan, almond, or a great native tree", "story": "Across Java, certain great trees are the fixed dwellings of spirits (jihad / lelembut) who can possess a person (kerasukan) to deliver blessings, healing, or messages. Pilgrims travel to a specific sacred tree to be possessed by its spirit — to receive a cure, a prophecy, or a gift of strength. The tree is the spirit's anchor: the spirit is bound to that tree, and the pilgrim's journey is to the tree, not to a temple. The most famous of these is the tradition of the sacred trees of the Javanese spiritual landscape.", "history": "The kerasukan (possession) tradition and its sacred trees are a deep layer of Javanese spiritual life, underlying the official Islam and the older Hindu-Buddhist heritage. The practice is part of the broader Javanese (and wider Indonesian) pattern of spirit-dwelling tr

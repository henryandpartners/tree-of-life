ees, and it persists in modern Java as a living form of popular piety. The sacred trees are often old, large, and located at crossroads, riverbanks, or forest edges — the liminal places where the spirit world is thought to be thin.", "details": "The Javanese sacred tree is a site of direct spiritual contact: the tree is not merely honored but used as the point of entry for a spirit into a human body. This makes it a 'functional' sacred tree — a tree with a specific spiritual service (healing, prophecy, possession) rather than a purely symbolic one. It is one of the most active forms of tree-spirit worship in the world.", "symbolism": ["spirit possession", "healing", "the spirit's anchor", "direct contact with the divine"], "sources": ["Javanese kerasukan (possession) tradition", "Ethnographic studies of Javanese sacred trees and spirit worship"], "emblem": {"form": "branching", "accent": "#7a4f8f", "wind": true}, "photo": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3d/Sycomoros_old.jpg/330px-Sycomoros_old.jpg", "label": "Ficus", "title": "Ficus"}}, {"id": "balinese-grove", "name": "Sacred Grove of the Balinese Village", "native": "wana · the forest;  banjar grove", "culture": "Balinese (Bali, Indonesia)", "region": "southeast-asia", "era": "Ancient; continuous to present", "type": "Village sacred grove", "tree": "Mixed native forest (banyan, areca, and other sacred species)", "story": "Each Balinese village (banjar) keeps a sacred grove (wana) at its edge, a stand of trees that is the dwelling of the village's guardian spirits and of the gods. The grove is the village's spiritual boundary and its source of water and protection. No one cuts a tree in the grove; offerings are made at its threshold; and the grove is the living link between the village and the mountain (the direction of the sacred). To protect the grove is to protect the village.", "history": "The Balinese sacred grove is a central institution of Balinese Hindu village life, rooted in the Tri Hita Karana philosophy (harmony among humans, between humans and the divine, and between humans and nature). The grove is the physical expression of that third harmony — the living, protected relationship between the village and the natural world. It is part of the wider Balinese system of sacred landscapes (the concept of the 'sacred center' and the 'sacred boundary') and persists as a living practice in every Balinese village.", "details": "The Balinese grove is a community-managed sacred forest — a real, functioning institution of environmental and spiritual protection. It is the Balinese answer to the question of how a community keeps a piece of the wild alive and sacred: by making it the dwelling of the gods and the boundary of the village. It is one of the most successful examples in the world of a sacred tree/grove tradition that also functions as conservation.", "symbolism": ["village boundary", "harmony with nature", "the gods' dwelling", "sacred water"], "sources": ["Balinese Hindu village (banjar) tradition and Tri Hita Karana philosophy", "Ethnographic studies of Balinese sacred groves (wana)"], "emblem": {"form": "multi", "accent": "#5b8f6f", "fronds": true}, "photo": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0d/Big_Banyan_Tree_at_Bangalore.jpg/330px-Big_Banyan_Tree_at_Bangalore.jpg", "label": "Banyan", "title": "Banyan"}}, {"id": "myanmar-nat", "name": "Sacred Trees of the Myanmar Nats", "native": "နတ် · nat (spirit); သစ် · tree", "culture": "Burmese (Myanmar)", "region": "southeast-asia", "era": "Pre-Buddhist; continuous alongside Theravada Buddhism", "type": "Nat (spirit) dwelling tree", "tree": "Varies — each nat is associated with a specific tree or grove", "story": "In Myanmar, the 37 nats (powerful spirits) — and countless local nats — are each associated with a sacred tree or grove where they dwell and where offerings are made. A nat's tree is its body and its throne: to honor the nat, one honors the tree. The nats are the spirits of ancestors, of heroes, and of the natural world, and their trees are the fixed points of their power. Pilgrims travel to a nat's tree to make merit, to seek protection, and to negotiate with the spirit for prosperity and safety.", "history": "Nat worship is the indigenous spiritual layer of Burmese religion, coexisting with (and predating) Theravada Buddhism. The 37 nats were formally recognized and ordered in the 19th century (under King Bagyidaw), but the worship of nat-spirits in trees is far older. The tradition is a core part of Burmese popular religion, and the sacred trees of the nats are a visible and active part of the Burmese landscape and ritual life. It is part of the wider Southeast Asian pattern of spirit-dwelling trees.", "details": "The Myanmar nat tree is a personalized sacred tree: each nat has its own tree, its own character, and its own domain (some are spirits of the dead, some of nature, some of historical figures). This makes the nat tree a richly individualized form of the sacred-tree tradition — a tree with a name, a biography, and a personality, rather than a generic spirit-dwelling. It is one of the most elaborate systems of tree-spirit worship in the world.", "symbolism": ["named spirit dwelling", "merit and protection", "ancestral power", "personalized sacred tree"], "sources": ["Myanmar nat (spirit) worship tradition and the 37 nats", "Ethnographic studies of Burmese nat trees and spirit worship"], "emblem": {"form": "round", "accent": "#c2543c", "jewels": true}, "photo": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bb/Dipterocarpus_bourdillonii_01.JPG/330px-Dipterocarpus_bourdillonii_01.JPG", "label": "Dipterocarpus", "title": "Dipterocarpus"}}, {"id": "aztec-ometl", "name": "Ometeōchtli, the Tree of the Sky", "native": "ōmeteōchtli · the sky tree", "culture": "Mexica (Aztec)", "region": "americas", "era": "Classic period (14th–16th c. CE)", "type": "Cosmic axis-mundi tree", "tree": "Ceiba (Ceiba pentandra)", "story": "At the center of the Mexica world stands the great ceiba, the Ometeōchtli, the tree of the sky. Its roots reach down into the nine levels of the underworld (Mictlan), its trunk passes through the human world, and its crown holds up the heavens. Coiled around the trunk is the feathered serpent Quetzalcōatl, whose body is the tree's binding, and at the crown dwell the gods. The four directions of the world branch out from the tree's four main limbs. To stand at the base is to stand at the exact navel of creation.", "history": "The ceiba as world tree is the inherited Mesoamerican axis mundi, present in Maya, Olmec, and later Mexica cosmology. In the Mexica picture it is the Ometeōchtli, the central tree of the cosmic mountain, and it appears in the iconography of the Templo Mayor and in the codices as the axis from which the four cardinal directions radiate. The ceiba's association with Quetzalcōatl makes it the tree at the center of the Mexica creation narrative — the tree around which the fifth sun was set.", "details": "The ceiba's biology mirrors its myth: its thick, buttressed trunk, its aerial roots, and its enormous height made it the natural image of a world pillar. The association with Quetzalcōatl (the feathered serpent) ties the tree to wind, to the morning star, and to the giver of life. It is the Mesoamerican counterpart to Yggdrasil and the Dayak world tree — the axis that holds the cosmos in one column.", "symbolism": ["axis mundi", "the four directions", "Quetzalcōatl's body", "the navel of creation"], "sources": ["Mexica (Aztec) cosmology; the codices (Borgia, Nuttall, Vaticanus A)", "Restall, Matthew. The Maya (context of Mesoamerican world-tree)", "Millon, Renato. The Aztecs (cosmography of the Templo Mayor)"], "emblem": {"form": "tall", "accent": "#c2543c", "cascade": true}, "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/thumb/5/57/Panguana-Lupuna-2008-2.jpg/500px-Panguana-Lupuna-2008-2.jpg", "label": "Ceiba pentandra", "title": "Ceiba pentandra"}}, {"id": "maya-witz", "name": "Witz, the World Tree of the Maya", "native": "witz · the sacred mountain-tree", "culture": "Maya", "region": "americas", "era": "Preclassic–Classic (2000 BCE–900 CE) and continuous", "type": "Cosmic axis-mundi tree", "tree": "Ceiba (Ceiba pentandra)", "story": "In Maya cosmology the world tree (often the ceiba) is the axis that connects the three worlds: the upper world of the gods, the human world, and Xibalba, the underworld. The tree grows out of the sacred mountains (witz, which means both 'tree' and 'mountain'), and its roots reach into the caves of the underworld where the ancestors dwell. The jaguar, the deer, and the howler monkey — the lords of the night — travel along the tree's trunk between the worlds. At the crown, the tree bears the fruits of life and the seat of the gods.", "history": "The witz concept — the fusion of tree and mountain as the axis of the world — is one of the oldest and most continuous ideas in Mesoamerican cosmology, running from the Olmec through the Classic Maya to the modern Maya. The ceiba's role as world tree is visible in the iconography of the Classic temples (the temple itself is a stylized witz) and in the Popol Vuh, where the first tree the gods plant is the world tree. It remains a living concept in modern Maya (K'iche', Q'eqchi') cosmology and ritual.", "details": "The witz is a double image: the tree is a mountain and the mountain is a tree. This fusion is the key to Maya sacred landscape — a great ceiba is a mountain you can climb to the gods, and a sacred cave is a root you can descend into the underworld. The tree is thus not a symbol but the actual structure of the world, the ladder between life and death and between earth and sky.", "symbolism": ["axis mundi", "tree–mountain fusion", "the three worlds", "the ladder of the soul"], "sources": ["Popol Vuh (the K'iche' creation narrative)", "The codices (Dresden, Madrid) — witz and ceiba iconography", "Culican, Luis. The World Tree of the Maya (witz cosmology)"], "emblem": {"form": "conical", "accent": "#4f7d52", "cascade": true}, "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/thumb/5/57/Panguana-Lupuna-2008-2.jpg/500px-Panguana-Lupuna-2008-2.jpg", "label": "Ceiba pentandra", "title": "Ceiba pentandra"}}, {"id": "kiche-world-tree", "name": "World Tree of the Popol Vuh", "native": "Yuh' Tepeu · the tree of the gods", "culture": "K'iche' (Maya)", "region": "americas", "era": "Pre-Columbian; codified in the 16th c. Popol Vuh", "type": "Creation / axis-mundi tree", "tree": "Unnamed great tree (the ceiba in later identification)", "story": "In the Popol Vuh, after the gods create the world, they plant a great tree at its center — the world tree — before they create humanity. The tree is the first and most important thing the gods set in the world, the axis that holds the cosmos together. Only after the tree is planted do the gods turn to making the humans who will live beneath it and worship it. The tree is thus prior to, and more fundamental than, humankind.", "history": "The Popol Vuh is the K'iche' Maya creation narrative, composed in the K'iche' language and written down in the 16th century (the oldest surviving copy dates to c. 1554–1701). The world tree it describes is the K'iche' expression of the wider Mesoamerican witz cosmology. The narrative's sequence — world, then tree, then humans — encodes a theology in which the cosmic axis is the primary act of creation, and humanity is the secondary, dependent order that lives in the tree's shade.", "details": "The Popol Vuh's ordering — tree before people — is the distinctive theological claim: the axis mundi is the gods' first and greatest work, and humans are the tenants of a world the tree already holds up. It is a precise statement of the sacred tree's primacy, making the tree not a symbol of creation but the first act of it. It is the clearest textual expression of the Mesoamerican world tree in a creation narrative.", "symbolism": ["primacy of the axis", "creation order", "the gods' first work", "humanity as tenant"], "sources": ["Popol Vuh (the K'iche' creation narrative, trans. Dennis Tedlock / Recinos & Adams)", "Studies of K'iche' Maya cosmology and the world tree"], "emblem": {"form": "tall", "accent": "#7a4f8f", "star": true}, "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/thumb/5/57/Panguana-Lupuna-2008-2.jpg/500px-Panguana-Lupuna-2008-2.jpg", "label": "Ceiba pentandra", "title": "Ceiba pentandra"}}, {"id": "aztec-amate", "name": "Amate, the Bark-Paper Fig", "native": "amate · the amate tree", "culture": "Mexica (Aztec) and wider Mesoamerican", "region": "americas", "era": "Pre-Columbian; continuous craft to present", "type": "Sacred craft tree", "tree": "Fig (Ficus, esp. Ficus cotinifolia / Ficus aurea)", "story": "The amate tree (a fig) gives its inner bark, which is beaten into the finest paper in the pre-Columbian world. On this paper the scribes painted the sacred books — the codices — that carried the myths, the rituals, the histories, and the calendars of the Mexica and the Maya. The amate tree is thus the tree that carried the sacred word: without its bark, the sacred knowledge had no body. The tree is the physical ancestor of every Mesoamerican sacred book.", "history": "Amate paper (from Nahuatl amatl, 'paper') was the primary writing surface in pre-Columbian Mesoamerica, made from the beaten inner bark of the fig. The great codices (the Borgia, the Nuttall, the Dresden) are on amate. When the Spanish burned the codices in the 16th century, they destroyed the paper of the amate tree — the physical body of a civilization's sacred knowledge. The amate craft survives today in Oaxaca and elsewhere, where the fig is still beaten into paper for ritual and artistic use, a continuous thread from the pre-Columbian scribes to the present.", "details": "The amate fig is a 'functional' sacred tree — its sanctity comes from what it gives: the material of the sacred book. It is the tree of the written word in Mesoamerica, and its bark is the medium through which the myths and rituals were made tangible. It is one of the few sacred trees whose holiness is defined by a craft rather than a cosmology — the tree that made knowledge physical.", "symbolism": ["the sacred word", "the body of the codex", "craft as sanctity", "knowledge made physical"], "sources": ["The Mesoamerican codices (Borgia, Nuttall, Dresden) — amate paper", "Millon, Renato. The Aztecs (amate paper and the codices)", "The Oaxacan amate paper craft (continuity)"], "emblem": {"form": "round", "accent": "#b08d3e", "bands": true}, "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5f/Ficus_cotinifolia_33045599.jpg/500px-Ficus_cotinifolia_33045599.jpg", "label": "Ficus cotinifolia", "title": "Ficus cotinifolia"}}, {"id": "tree-of-peace", "name": "Great Tree of Peace of the Haudenosaunee", "native": "the Great Tree of Peace (the white pine)", "culture": "Haudenosaunee (Iroquois)", "region": "americas", "era": "c. 12th c. CE (the Peacemaker's founding); continuous", "type": "Founding / covenant tree", "tree": "White pine (Pinus strobus)", "story": "When the Peacemaker (Deganawida) and Hiawatha founded the Haudenosaunee Confederacy, they planted a great white pine — the Tree of Peace — at the center of the longhouse. Its roots spread out in all four directions, reaching every nation, binding them together in peace. Its branches reach up to the sky, carrying the message of peace to the spirits above. Beneath it the council sits, and its shade is the peace itself. To cut the Tree of Peace is to break the covenant of the Confederacy.", "history": "The Tree of Peace is the founding symbol of the Haudenosaunee (Iroquois) Confederacy, established by the Peacemaker and Hiawatha (traditionally placed around the 12th century, though the confederacy's final form is later). The Great Law of Peace (the Gayanashagowa) is the constitution of the Confederacy, and the Tree of Peace is its central image. The white pine was chosen for its longevity, its straight trunk, and its open, spreading crown — the physical embodiment of lasting, all-reaching peace. The image survives in the Haudenosaunee flag and in the confederacy's continuing governance.", "details": "The Tree of Peace is a political as well as a spiritual tree: it is the living symbol of a constitution, the root-system that binds six (originally five) nations into one. Its roots reaching to every nation encode the idea that peace is not an abstraction but a root-network — a living structure that holds the political order together. It is one of the few sacred trees that is also a founding document in the secular sense.", "symbolism": ["the covenant of peace", "political unity", "longevity", "the root-network of nations"], "sources": ["The Great Law of Peace (Gayanashagowa) of the Haudenosaunee", "Alder, Donald. The Haudenosaunee and the Tree of Peace", "The Haudenosaunee (Iroquois) confederacy tradition"], "emblem": {"form": "tall", "accent": "#4f7d52", "roots": true}, "photo": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/48/Pinus_strobus_trees.jpg/330px-Pinus_strobus_trees.jpg", "label": "Pinus strobus", "title": "Pinus strobus"}}, {"id": "lakota-sacred-tree", "name": "The Sacred Tree of the Black Elk Vision", "native": "the hanging / sacred tree (Lakota vision)", "culture": "Lakota (Siouan)", "region": "americas", "era": "19th century (Black Elk's vision, c. 1876–1890); continuous in Lakota memory", "type": "Vision / cosmic tree", "tree": "A great tree (the 'hanging tree' of the vision; often read as a world tree)", "story": "In the great vision of Black Elk (Oglala Lakota), as a boy struck unconscious on the plains, he is lifted up into a great tree — a tree of light, hung in the air, its branches reaching out and its leaves bright with the faces of the spirits. From the top of the tree he sees the whole world spread out below, and the voices of the elders of the spirit world call to him: he is to be a holy man, a bringer of the vision. The tree is the axis of the vision — the ladder by which a human is lifted into the cosmic order and given a mission.", "history": "Black Elk's vision is one of the most widely known Native American spiritual narratives, recorded by John Neihardt in Black Elk Speaks (1933). The sacred tree at its center is the Lakota expression of the wider Plains and Siouan world-tree motif, and the vision is the foundational text of Black Elk's life and of the later Oglala spiritual movement. The tree in the vision — a tree hung in the air, bearing the faces of the spirits — is a precise image of the axis mundi as a living, conscious ladder between the human and the divine.", "details": "The tree of Black Elk's vision is distinctive in being a tree in the air — detached, hung, radiant — rather than a tree rooted in the earth. This makes it a tree of ascent and revelation: the axis by which a human is lifted into the cosmic perspective. It is the Lakota image of the world tree as a ladder of vision, and it sits at the center of one of the most important spiritual autobiographies in Native American literature.", "symbolism": ["the ladder of vision", "ascent to the cosmic", "the mission", "the tree of light"], "sources": ["Neihardt, John. Black Elk Speaks (1933)", "The Oglala Lakota vision tradition"], "emblem": {"form": "branching", "accent": "#d4a017", "star": true}, "photo": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/af/Quercus_robur.jpg/330px-Quercus_robur.jpg", "label": "Oak", "title": "Quercus"}}, {"id": "nw-coast-cedar", "name": "Red Cedar of the Northwest Coast", "native": "the red cedar (Haida / Tlingit / Coast Salish)", "culture": "Haida, Tlingit, and Coast Salish (Northwest Coast)", "region": "americas", "era": "Ancient; continuous to present", "type": "Cultural / spiritual tree", "tree": "Western red cedar (Thuja plicata)", "story": "On the Northwest Coast, the red cedar is the tree of the culture itself. It gives the bark for the clothing, the blankets, and the weaving; the wood for the canoes, the houses, and the totem poles; and the boughs for the sweat lodge and the ceremonies. The Haida, Tlingit, and Coast Salish peoples consider the red cedar a relative and a giver — a being that gives its body so that the people can live, build, and worship. To take cedar is to enter a relationship of reciprocity, and to waste it is a grave offense.", "history": "The red cedar (Thuja plicata) is the most important cultural material of the Northwest Coast peoples, and its use spans thousands of years. The great totem poles of the Haida and Tlingit are carved from cedar; the ocean-going canoes are cedar; the regalia and the weaving are cedar bark. The tree's centrality is so total that it is often called the 'tree of life' of the Northwest Coast — the single species from which the material culture is built. The practice of sustainable cedar harvesting (taking only what is needed, with ceremony and thanks) is a continuous tradition.", "details": "The red cedar is a 'total' sacred tree — it is sacred because it gives everything: clothing, transport, shelter, art, and ritual material. Its sanctity is relational and reciprocal: the people take from the tree and give back thanks and restraint. It is one of the clearest examples in the world of a sacred tree whose holiness is defined by its generosity and by the ethic of reciprocity that its use demands.", "symbolism": ["the giver of all", "reciprocity", "cultural foundation", "the relative"], "sources": ["Haida, Tlingit, and Coast Salish cedar tradition", "The totem-pole and canoe traditions of the Northwest Coast", "Ethnographic studies of Northwest Coast red-cedar use"], "emblem": {"form": "tall", "accent": "#5b7d3e", "bands": true}, "photo": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a3/Thuja_plicata_Vancouver.jpg/330px-Thuja_plicata_Vancouver.jpg", "label": "Thuja plicata", "title": "Thuja plicata"}}, {"id": "inca-huaca", "name": "Huaca, the Sacred Trees of the Inca", "native": "huaca · the sacred thing", "culture": "Inca (Tawantinsuyu)", "region": "americas", "era": "Inca period (15th–16th c. CE); pre-Inca roots", "type": "Huaca (sacred object) tree", "tree": "Varies — native Andean trees and groves", "story": "In the Inca world, a huaca is anything sacred — a mountain, a river, a stone, a tree, an image. The sacred trees (huacas) are the fixed dwelling-places of the malleqs (spirits) and of the ancestors, and they are the points at which the community makes offerings (despachos) to secure the favor of the spirits and the fertility of the land. A huaca-tree is the local sacred center of a village or an ayllu, the point at which the human and the spirit worlds meet and exchange.", "history": "The huaca system is the indigenous sacred-landscape tradition of the Andes, inherited by the Inca from the pre-Inca cultures (the Wari, the Tiwanaku, and earlier). The Inca incorporated thousands of huacas — including sacred trees and groves — into the imperial system of sacred places. The tradition survived the Spanish conquest in transformed form and persists in modern Andean (Quechua and Aymara) practice, where the huaca-trees and the offerings to them are a living part of rural Andean religion.", "details": "The huaca-tree is a 'sacred object' in the Andean sense — a thing that is a person, that has a will and a presence, and with which one negotiates. Its sanctity is not symbolic but ontological: the tree is a being, and the offerings are a real exchange with a real agent. It is the Andean expression of the sacred tree as a living person rather than a symbol, and it is one of the most persistent pre-Columbian traditions in the Americas.", "symbolism": ["the sacred as person", "exchange with the spirit", "local sacred center", "fertility and favor"], "sources": ["The Inca huaca tradition", "The Andean (Quechua/Aymara) huaca and despacho tradition", "Ethnographic studies of Andean sacred landscape and huacas"], "emblem": {"form": "roots", "accent": "#7b4b2a", "roots": true}, "photo": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/eb/Polylepis_rugulosa_%28A._Yates%29.jpg/330px-Polylepis_rugulosa_%28A._Yates%29.jpg", "label": "Polylepis", "title": "Polylepis"}}, {"id": "mapuche-pehuen", "name": "Pehuen, the Sacred Araucaria of the Mapuche", "native": "pehuen · the pehuén (Araucaria)", "culture": "Mapuche (Araucanía, Chile/Argentina)", "region": "americas", "era": "Ancient; continuous to present", "type": "Spirit-dwelling / sacred tree", "tree": "Araucaria araucana (the pehuén / monkey-puzzle)", "story": "For the Mapuche, the pehuen (the araucaria) is a sacred tree, the dwelling of the spirits and a symbol of endurance and of the connection between the earth and the sky. Its seeds (the piñones) are food, its wood is for building, and its great, slow-growing form is the image of the Mapuche's own resilience. The pehuen is the tree of the Mapuche identity — the tree that has stood through the conquest, the colonization, and the long struggle for the land, and that still stands as the symbol of the Mapuche's rootedness and their claim to the land.", "history": "The pehuen (Araucaria araucana) is the signature tree of the Andean patagonian region and the central sacred tree of the Mapuche. The region's name, Araucanía, is derived from the tree. The pehuen is a symbol of Mapuche identity and resistance, and the Mapuche's relationship with it — as food, building material, and sacred tree — is a continuous tradition. The tree's great age and slow growth made it the natural image of endurance, and it is central to the Mapuche's claim to the land and to their spiritual life.", "details": "The pehuen is a 'total' sacred tree for the Mapuche — sacred, useful, and symbolic at once. Its very form (the slow-growing, long-lived araucaria) is the image of the Mapuche's own endurance. It is the botanical root of the region's name and the central plant of Mapuche identity, making it one of the most politically and spiritually charged sacred trees in the Americas.", "symbolism": ["endurance", "Mapuche identity", "the claim to the land", "the dwelling of the spirits"], "sources": ["The Mapuche pehuen (araucaria) tradition", "The Araucanía region (name derived from the pehuen)", "Ethnographic studies of Mapuche sacred trees and identity"], "emblem": {"form": "conical", "accent": "#8a5a3b", "bands": true}, "photo": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bb/Araucaria_en_Parque_Nacional_Conguillio.jpg/330px-Araucaria_en_Parque_Nacional_Conguillio.jpg", "label": "Araucaria araucana", "title": "Araucaria araucana"}}, {"id": "maori-whakapapa", "name": "Whakapapa, the Genealogical Tree of the Māori", "native": "whakapapa · the genealogy / layered foundation", "culture": "Māori (Aotearoa / New Zealand)", "region": "oceania", "era": "Ancient; continuous to present", "type": "Genealogical / cosmic tree", "tree": "The whakapapa (a genealogical/cosmological structure, often imagined as a tree)", "story": "For the Māori, whakapapa is the layered genealogy that connects every person, every thing, and every place to every other — a tree of descent that reaches from the individual back through the ancestors, the tribes, the natural world, and up to the gods and to the primal parent. The whakapapa is the tree of identity: it tells you who you are, where you come from, and what you are responsible to. To know your whakapapa is to know your place in the whole of creation. The tree is the structure of Māori identity and of the Māori relationship to the land and the cosmos.", "history": "Whakapapa is a foundational concept of Māori culture and a central organizing principle of Māori society. It is the genealogical and cosmological tree that connects the human to the divine and to the natural world, and it is the basis of Māori identity, law, and relationship to the land (the concept of kaitiakitanga, guardianship). The tradition is continuous and living, and the whakapapa is recited in the karanga (the call) and in the powhiri (the welcome) as the means by which a person is connected to the ancestors and to the place. It is the Māori expression of the sacred tree as the structure of identity and of the cosmos.", "details": "The whakapapa is distinctive in being a genealogical tree — a tree of descent rather than a tree of the world. It is the structure by which the Māori understand themselves as part of a continuous lineage that reaches back to the gods and forward to the descendants. It is the Māori answer to the question of identity and belonging, and it is one of the most sophisticated and living expressions of the sacred-tree concept in the world.", "symbolism": ["identity and descent", "the connection to the gods", "guardianship (kaitiakitanga)", "the structure of belonging"], "sources": ["The Māori whakapapa tradition", "The Māori karanga and powhiri (genealogical welcome) tradition", "Studies of Māori cosmology and whakapapa"], "emblem": {"form": "branching", "accent": "#3f6f8f", "roots": true}, "photo": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5b/PohutukawaCornwallis.jpg/330px-PohutukawaCornwallis.jpg", "label": "Pōhutukawa", "title": "Metrosideros excelsa"}}, {"id": "hawaiian-koa", "name": "Koa, the Sacred Wood of the Aliʻi", "native": "koa · the koa tree", "culture": "Hawaiian", "region": "oceania", "era": "Ancient; continuous to present", "type": "Aliʻi (chiefly) sacred tree", "tree": "Koa (Acacia koa)", "story": "In Hawaii, the koa is the sacred wood of the aliʻi (the chiefs and the royalty). Its heartwood is the material of the most sacred objects — the staffs of office (the ʻōpa), the ceremonial objects, and the finest canoes. The koa is a tree of rank and of the divine: to work in koa is to work in the wood of the chiefs and the gods. The tree is the botanical embodiment of the Hawaiian concept of rank (the ʻāina and the aliʻi), and its wood carries the mana (the sacred power) of the office it serves.", "history": "The koa (Acacia koa) is the signature hardwood of Hawaii and the traditional wood of the aliʻi. Its use for the staffs of office, the ceremonial objects, and the canoes is a continuous tradition from the ancient Hawaiian kingdom to the present. The tree's association with rank and the divine is a core part of the Hawaiian cultural and spiritual system, and the koa is protected today as a threatened species — a protection that reflects its continuing cultural and spiritual significance. It is the Hawaiian expression of the sacred tree as the material of the divine and the political.", "details": "The koa is a 'rank' sacred tree — its sanctity is tied to the social and spiritual hierarchy (the aliʻi and the mana). It is the wood that carries the sacred power of the office, and its use is reserved for the most important and the most sacred objects. It is one of the clearest examples of a sacred tree whose holiness is defined by its association with rank and the divine, and by the restriction of its use to the highest purposes.", "symbolism": ["rank and the aliʻi", "the mana (sacred power)", "the wood of the divine", "protection and continuity"], "sources": ["The Hawaiian koa (Acacia koa) tradition", "The aliʻi (chiefly) and mana tradition of Hawaii", "Ethnographic studies of Hawaiian sacred wood and the koa"], "emblem": {"form": "round", "accent": "#8a5a3b", "bands": true}, "photo": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f9/Acacia_koa_study_7.jpg/330px-Acacia_koa_study_7.jpg", "label": "Acacia koa", "title": "Acacia koa"}}, {"id": "hawaiian-lehua", "name": "Lehua, the Sacred Flower-Tree of Pele", "native": "ʻlehua · the lehua tree", "culture": "Hawaiian", "region": "oceania", "era": "Ancient; continuous to present (state flower since 1892)", "type": "Goddess-associated sacred tree", "tree": "Lehua (Meliosma rugosa / the ʻlehua)", "story": "In Hawaii, the ʻlehua tree (with its brilliant red and yellow flowers) is sacred to Pele, the goddess of fire and of the volcanoes. The lehua is the tree of the volcano, and its red flowers are the image of Pele's fire. To plant a lehua is to invite the presence of Pele, and the tree is associated with the sacred power (the mana) of the volcanic goddess. The lehua is also the state flower of Hawaii, a formal recognition of its sacred and cultural centrality. It is the tree that carries the fire of the goddess into the visible world.", "history": "The ʻlehua (Meliosma rugosa) is one of the most sacred trees in Hawaiian culture, associated with Pele and with the volcanic tradition. Its designation as the state flower of Hawaii (in 1892) is a formal, modern recognition of its ancient sacred status. The tree's association with Pele and with fire is a core part of the Hawaiian spiritual landscape, and the lehua is a living part of Hawaiian ritual and of the relationship between the people and the volcanic goddess. It is the Hawaiian expression of the sacred tree as the visible body of a goddess.", "details": "The lehua is a 'goddess-body' sacred tree — its flowers are the image of Pele's fire, and the tree is the visible manifestation of the volcanic goddess. Its red and yellow blossoms make it the botanical embodiment of fire, and its sacred status is tied directly to the person of Pele. It is one of the clearest examples of a sacred tree as the bodily image of a specific deity, and it is the most florally vivid of the Hawaiian sacred trees.", "symbolism": ["the body of Pele", "fire made visible", "the mana of the goddess", "the state flower"], "sources": ["The Hawaiian ʻlehua (Meliosma rugosa) tradition", "The Pele (volcanic goddess) tradition of Hawaii", "The designation of the ʻlehua as the state flower of Hawaii (1892)"], "emblem": {"form": "round", "accent": "#c2543c", "fruit": true}, "photo": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ed/Meliosma_veitchorum1.jpg/330px-Meliosma_veitchorum1.jpg", "label": "Meliosma", "title": "Meliosma"}}, {"id": "aboriginal-dreaming", "name": "The Dreaming Trees of the Aboriginal Australians", "native": "the Dreaming / the Dreamtime trees", "culture": "Aboriginal Australian (many nations)", "region": "oceania", "era": "Ancient (the Dreaming); continuous for 60,000+ years", "type": "Dreaming / songline tree", "tree": "Varies — the great trees of the Dreaming (e.g., the ironbark, the mulga, the coolamon trees)", "story": "In Aboriginal Australian cosmology, the Dreaming (the Tjukurpa) is the eternal time of creation, when the ancestral beings sang the world into existence. The great trees of the Dreaming are the physical traces of that singing — the places where the ancestors made their camps, where they sang, and where they left their power. Each tree is a node in a songline, a point where the Dreaming is present in the land, and to sing the song of a tree is to keep the world alive. The trees are not objects in the landscape; they are the landscape's memory and its law.", "history": "The Dreaming (the Tjukurpa) is the foundational cosmology of Aboriginal Australian culture, the oldest continuous spiritual tradition on earth, stretching back more than 60,000 years. The great trees of the Dreaming are central to the songlines — the sung paths that cross the continent and connect the sacred sites. The relationship between the Aboriginal peoples and the great trees (the ironbarks, the mulga, the coolamon trees) is a continuous, living tradition, and the trees are integral to the law, the ceremony, and the identity of the Aboriginal nations. It is one of the oldest and most continuous sacred-tree traditions in the world.", "details": "The Dreaming trees are distinctive in being the physical traces of an eternal act of creation — the places where the ancestors sang the world into being. Their sanctity is not symbolic but ontological: the tree is the land's memory and its law, and to sing its song is to keep the world in existence. It is one of the most profound expressions of the sacred tree as the living structure of reality, and it is the oldest continuous tree-spirit tradition known.", "symbolism": ["the Dreaming / the Tjukurpa", "the songline", "the land's memory", "the law of the world"], "sources": ["The Aboriginal Australian Dreaming (Tjukurpa) tradition", "The songline tradition of Aboriginal Australia", "Studies of Aboriginal Australian cosmology and the sacred trees of the Dreaming"], "emblem": {"form": "roots", "accent": "#c2843c", "roots": true}, "photo": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4c/Eucalyptus_tereticornis_flowers%2C_capsules%2C_buds_and_foliage.jpeg/330px-Eucalyptus_tereticornis_flowers%2C_capsules%2C_buds_and_foliage.jpeg", "label": "Eucalyptus", "title": "Eucalyptus"}}, {"id": "baobab", "name": "The Baobab, the Tree of Life of Africa", "native": "the baobab (Adansonia)", "culture": "Pan-African (many peoples)", "region": "africa", "era": "Ancient; continuous to present", "type": "Village / sacred / life tree", "tree": "Baobab (Adansonia, esp. Adansonia digitata)", "story": "Across Africa, the baobab is the tree of life. Its great trunk stores water for the dry season, its fruit is food, its leaves are medicine, and its shade is the meeting place of the village. In the myths of the Dogon, the Yoruba, and many other peoples, the baobab is a tree with a spiritual history — sometimes a tree that was turned upside-down by the gods (its roots in the sky, its branches in the earth), sometimes the dwelling of the ancestors, sometimes the axis of the village. The baobab is the tree that keeps a community alive through the drought, and its very survival is the image of life itself.", "history": "The baobab (Adansonia) is one of the most widespread and most sacred trees in Africa, with a presence in the myth, the medicine, the food, and the daily life of countless African peoples. Its great age (some baobabs are thousands of years old) and its capacity to store water made it the natural symbol of endurance and of life in the dry savanna. The tree appears in the creation myths of many African peoples (the 'upside-down baobab' myth is widespread), and it is a central feature of the African sacred landscape. It is one of the most universally recognized sacred trees in the world.", "details": "The baobab is a 'total' life tree — it gives water, food, medicine, shade, and spiritual presence. Its very biology (the water-storing trunk, the great age) makes it the image of survival and of life in the face of the drought. The 'upside-down baobab' myth (the tree that was inverted by the gods) is one of the most widespread African creation stories, and it encodes the idea that the baobab is a tree set apart by the divine. It is the single most iconic sacred tree of the African continent.", "symbolism": ["life in the drought", "endurance", "the village's meeting place", "the inverted tree myth"], "sources": ["The African baobab (Adansonia) tradition", "The 'upside-down baobab' creation myth (widespread in West and East Africa)", "Ethnographic studies of the baobab in African myth and daily life"], "emblem": {"form": "round", "accent": "#8a5a3b", "wells": true}, "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/09/Baobab_and_elephant%2C_Tanzania.jpg/500px-Baobab_and_elephant%2C_Tanzania.jpg", "label": "Adansonia digitata", "title": "Adansonia digitata"}}, {"id": "yoruba-iroko", "name": "Irókò, the Sacred Tree of Ọ̀ṣun and the Yoruba", "native": "irókò · the iróko tree", "culture": "Yoruba (Nigeria, Benin, and the diaspora)", "region": "africa", "era": "Ancient; continuous to present", "type": "Orishas / sacred tree", "tree": "Iróko (Milicia excelsa / the African teak)", "story": "In Yoruba religion, the iróko is a sacred tree, associated with the orishas (the divine powers) and with the ancestors. It is the tree of strength and of the community, and its great size and its durability made it the natural image of the divine power (the àṣẹ) that holds the world together. The iróko is a tree of the orishas, and its presence in a village is a sign of the divine favor. To cut an iróko without ritual is a grave offense, and the tree is a fixed point of the Yoruba sacred landscape. In the Yoruba cosmology, the iróko is the tree that carries the weight of the world and the power of the gods.", "history": "The iróko (Milicia excelsa) is one of the most sacred trees in Yoruba religion, associated with the orishas and with the concept of àṣẹ (the divine power that makes things happen). Its use as a sacred tree is continuous from the ancient Yoruba kingdom to the present, and it survives in the Yoruba diaspora (in Cuba, Brazil, and the Caribbean) as a central element of the Santería, Candomblé, and other Yoruba-derived religions. The iróko is the botanical embodiment of the Yoruba concept of divine power, and it is one of the most important sacred trees of the Yoruba spiritual system.", "details": "The iróko is a 'power' sacred tree — its sanctity is tied to the concept of àṣẹ, the divine force that animates the world. Its great strength and durability made it the natural image of that power, and its presence is a sign of the divine favor. It is one of the clearest examples of a sacred tree as the bodily image of a divine force, and it is a central element of the Yoruba religion and its diaspora.", "symbolism": ["àṣẹ (divine power)", "strength and endurance", "the orishas' dwelling", "the sign of divine favor"], "sources": ["The Yoruba iróko (Milicia excelsa) tradition", "The Yoruba orisha and àṣẹ tradition", "The Yoruba diaspora (Santería, Candomblé) sacred-tree tradition"], "emblem": {"form": "tall", "accent": "#4f7d52", "bands": true}, "photo": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f3/Milicia_roadside_small.jpg/330px-Milicia_roadside_small.jpg", "label": "Milicia excelsa", "title": "Milicia excelsa"}}, {"id": "yoruba-egbesu", "name": "Ègbèsú, the Sacred Tree of Ifá", "native": "ègbèsú · the ègbèsú tree", "culture": "Yoruba (Nigeria, Benin, and the diaspora)", "region": "africa", "era": "Ancient; continuous to present", "type": "Ifá / divination sacred tree", "tree": "Ègbèsú (a specific sacred tree of the Ifá priests)", "story": "In the Yoruba Ifá tradition, the ègbèsú is the sacred tree of the babalawo (the Ifá priest). It is the tree under which the priest sits to consult the oracle, the tree that anchors the priest's connection to the divine and to the ancestors. The ègbèsú is the physical center of the Ifá shrine, and its presence is a requirement for the priest's work. To sit under the ègbèsú is to sit at the point where the human and the divine meet, and the tree is the channel through which the wisdom of Ifá flows. It is the tree of the sacred word and of the divine consultation.", "history": "The ègbèsú is a specific sacred tree of the Yoruba Ifá tradition, associated with the babalawo (the Ifá priests) and with the practice of divination. Its role as the anchor of the Ifá shrine and the seat of the priest's consultation is a continuous tradition from the ancient Yoruba kingdom to the present, and it survives in the Yoruba diaspora (in Cuba, Brazil, and the Caribbean) as a central element of the Ifá and the related orisha traditions. The ègbèsú is the botanical embodiment of the Ifá tradition's sacred center, and it is one of the most specific and functional of the Yoruba sacred trees.", "details": "The ègbèsú is a 'functional' sacred tree — its sanctity is defined by its role in the Ifá divination, as the tree under which the priest sits to consult the oracle. It is the physical anchor of the sacred word and of the divine consultation, and its presence is a requirement for the priest's work. It is one of the clearest examples of a sacred tree whose holiness is defined by a specific ritual function rather than a general cosmological symbol.", "symbolism": ["the sacred word", "the Ifá oracle", "the priest's anchor", "the channel of divine wisdom"], "sources": ["The Yoruba Ifá and babalawo (priest) tradition", "The ègbèsú sacred-tree tradition of the Ifá shrine", "The Yoruba diaspora (Ifá in Cuba, Brazil, and the Caribbean)"], "emblem": {"form": "branching", "accent": "#7b4b2a", "jewels": true}, "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/09/Baobab_and_elephant%2C_Tanzania.jpg/500px-Baobab_and_elephant%2C_Tanzania.jpg", "label": "Adansonia digitata", "title": "Adansonia digitata"}}, {"id": "dogon-tree", "name": "The Sacred Tree of the Dogon Creation", "native": "the Dogon sacred tree (the tree of the creation)", "culture": "Dogon (Mali)", "region": "africa", "era": "Ancient; recorded in the 20th c. (Grossinger, Griaule)", "type": "Creation / axis-mundi tree", "tree": "A great tree (the tree from which the first being descended)", "story": "In the Dogon creation myth, the supreme being Amma came down from the sky on a silver thread to create the world. When Amma had finished the creation, he planted a great tree at the center of the world — the tree of the creation — and then returned to the sky. The tree is the axis of the Dogon world, the point where the divine and the human meet, and the anchor of the world's order. The Dogon's sacred groves and their ritual trees are the living traces of that first planting, and the tree is the physical center of the Dogon cosmology and of their ritual life.", "history": "The Dogon creation myth and its sacred tree are among the most widely studied of the West African cosmologies, recorded by the ethnographers Marcel Griaule and Germaine Dieterlen in the mid-20th century (and popularized in the literature of the Dogon). The sacred tree of the Dogon creation is the axis of the Dogon world, and it is a central feature of the Dogon ritual life and their sacred groves. The myth is one of the great creation narratives of West Africa, and the tree is its central image — the tree that Amma planted to anchor the world and to mark the point where the divine and the human meet.", "details": "The Dogon sacred tree is a 'creation' sacred tree — its sanctity comes from being the first tree planted by the supreme being Amma, the anchor of the world's order. It is the axis of the Dogon cosmology and the physical center of their ritual life. It is one of the clearest examples of a sacred tree as the physical trace of a creation act, and it is a central element of the Dogon cosmology and one of the great creation narratives of West Africa.", "symbolism": ["the creation act", "the axis of the world", "the divine–human meeting point", "the anchor of order"], "sources": ["Griaule, Marcel & Dieterlen, Germaine. The Pale Fox (the Dogon myth)", "The Dogon creation myth and sacred-tree tradition", "Ethnographic studies of the Dogon cosmology (Mali)"], "emblem": {"form": "tall", "accent": "#d4763c", "star": true}, "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b9/Yggdrasil.jpg/500px-Yggdrasil.jpg", "label": "Tree of life", "title": "Tree of life"}}];
const REGIONS = {"ancient-near-east":"Ancient Near East","egypt":"Egypt","persia":"Persia & Zoroastrian","europe":"Europe","africa":"Africa","south-asia":"South Asia","southeast-asia":"Southeast Asia","east-asia":"East Asia","americas":"The Americas","oceania":"Oceania & Pacific"};
const ORDER = ["europe","africa","egypt","ancient-near-east","persia","south-asia","southeast-asia","east-asia","americas","oceania"];
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById('tree');
let activeId = null, regionFocus = null;

function el(tag, attrs){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }
function qpoint(a, c, b, t){ const u=1-t; return [u*u*a[0]+2*u*t*c[0]+t*t*b[0], u*u*a[1]+2*u*t*c[1]+t*t*b[1]]; }
function qdir(a, c, b, t){ const u=1-t; const dx=2*u*(c[0]-a[0])+2*t*(b[0]-c[0]), dy=2*u*(c[1]-a[1])+2*t*(b[1]-c[1]); const m=Math.hypot(dx,dy)||1; return [dx/m, dy/m]; }

/* ---------- emblem glyphs (viewBox 40x40) ---------- */
function glyphPaths(em){
  const f = em.form||'round';
  const p = [];
  const canopy = {
    round:   {c:[20,14], r:9},
    conical: {tri:[[20,5],[11.5,25],[28.5,25]]},
    tall:    {e:[20,13], rx:5.5, ry:10.5},
    branching:{}, roots:{}, frond:{}, multi:{}
  }[f];
  const trunk = (y1,y2,w=1.8)=>p.push({d:`M20 ${y1} L20 ${y2}`, w});
  if (f==='round'){ p.push({d:`M${20-9} 14 A9 9 0 1 0 ${20+9} 14 A9 9 0 1 0 ${20-9} 14 Z`, fill:.3}); trunk(23,32,2.4); }
  if (f==='conical'){ p.push({d:`M20 5 L11.5 25 L28.5 25 Z`, fill:.3}); trunk(25,32,2.4); }
  if (f==='tall'){ p.push({d:`M14.5 13 A5.5 10.5 0 1 0 25.5 13 A5.5 10.5 0 1 0 14.5 13 Z`, fill:.3}); trunk(23,32,2.2); }
  if (f==='branching'){ trunk(32,17,2.2); p.push({d:'M20 23 L12 12',w:1.6},{d:'M20 20 L28 9',w:1.6},{d:'M12 12 L9 8',w:1.4},{d:'M28 9 L31 5.5',w:1.4},{d:'M20 17 L16 10',w:1.4}); }
  if (f==='roots'){ p.push({d:'M15.5 12 A4.5 4.5 0 1 0 24.5 12 A4.5 4.5 0 1 0 15.5 12 Z', fill:.3}); trunk(16,25,2); p.push({d:'M20 25 L12 34',w:1.6},{d:'M20 25 L28 34',w:1.6},{d:'M20 25 L20 35',w:1.4},{d:'M12 34 L9 33',w:1.2},{d:'M28 34 L31 33',w:1.2}); }
  if (f==='frond'){ trunk(33,13,2); p.push({d:'M20 13 C13 8 8 11 5 7',w:1.6},{d:'M20 13 C27 8 32 11 35 7',w:1.6},{d:'M20 13 C14 16 9 15 6 18',w:1.4},{d:'M20 13 C26 16 31 15 34 18',w:1.4}); }
  if (f==='multi'){ p.push({d:'M9 13 A5 5 0 1 0 19 13 A5 5 0 1 0 9 13 Z', fill:.3},{d:'M21 13 A5 5 0 1 0 31 13 A5 5 0 1 0 21 13 Z', fill:.3},{d:'M15 24 A5 5 0 1 0 25 24 A5 5 0 1 0 15 24 Z', fill:.3}); trunk(33,29,1.4); p.push({d:'M20 33 L14 17',w:1.2},{d:'M20 33 L26 17',w:1.2}); }
  /* features */
  if (em.fruit) p.push({d:'M15 12 A1.7 1.7 0 1 0 18.4 12 A1.7 1.7 0 1 0 15 12 Z'},{d:'M23.5 16 A1.7 1.7 0 1 0 26.9 16 A1.7 1.7 0 1 0 23.5 16 Z'});
  if (em.star) p.push({d:'M20 1.5 L21.6 4.5 L24.6 6 L21.6 7.5 L20 10.5 L18.4 7.5 L15.4 6 L18.4 4.5 Z', fill:1});
  if (em.jewels) p.push({d:'M31 9 L32.2 11.4 L34.6 12.6 L32.2 13.8 L31 16.2 L29.8 13.8 L27.4 12.6 L29.8 11.4 Z', fill:1});
  if (em.bands) p.push({d:'M13 12 L27 12', w:1.1},{d:'M13.5 16.5 L26.5 16.5', w:1.1});
  if (em.cascade) p.push({d:'M33 10 C35.5 13 30.5 15 33 18 C35 20.5 31 22.5 33 25', w:1.4});
  if (em.fronds) p.push({d:'M8 30 C11 27 14 29 16 31', w:1.2},{d:'M24 31 C27 28 30 30 33 28', w:1.2});
  if (em.wells) p.push({d:'M9 36 C14 39 26 39 31 36', w:1.3, dash:'3 2.6'});
  if (em.wind) p.push({d:'M6 16 C9 15 11 17 9.5 19.5', w:1.3},{d:'M4 21 C8 20 11 22 9 24.5', w:1.3});
  if (em.bolt) p.push({d:'M24 2 L18.5 10 L22.5 10 L16.5 19', w:1.5});
  return p;
}
function emblemSVG(em, size){
  const col = em.accent || '#c9a86a';
  let inner = '';
  for (const g of glyphPaths(em)){
    if (g.fill){ inner += `<path d="${g.d}" fill="${col}" fill-opacity="${g.fill===1?0.95:0.35}" stroke="none"/>`; }
    else { inner += `<path d="${g.d}" fill="none" stroke="${col}" stroke-width="${g.w||1.6}" stroke-linecap="round" stroke-linejoin="round"${g.dash?` stroke-dasharray="${g.dash}"`:''}/>`; }
  }
  return `<svg viewBox="0 0 40 40" width="${size}" height="${size}" aria-hidden="true">${inner}</svg>`;
}

/* ---------- tree geometry ---------- */
const TIPS = {
  "europe":[148,712], "africa":[96,532], "egypt":[152,352], "ancient-near-east":[300,214], "persia":[448,126],
  "south-asia":[556,122], "southeast-asia":[704,210], "east-asia":[856,348], "americas":[908,528], "oceania":[854,708]
};
const ATTACH = {
  "europe":[489,848], "africa":[494,752], "egypt":[497,662], "ancient-near-east":[499,586], "persia":[500,534],
  "south-asia":[501,538], "southeast-asia":[502,592], "east-asia":[504,668], "americas":[506,758], "oceania":[511,852]
};
const groups = {};
DATA.forEach(t => (groups[t.region] = groups[t.region] || []).push(t));

function build(){
  /* defs: glow filter + gradient */
  const defs = el('defs',{});
  defs.innerHTML = `
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#1d3327" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#1d3327" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trunkG" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2c3a31"/>
      <stop offset="100%" stop-color="#1e2a22"/>
    </linearGradient>`;
  svg.appendChild(defs);
  svg.appendChild(el('ellipse',{cx:500,cy:470,rx:430,ry:420,class:'glow',fill:'url(#bgGlow)'}));
  /* ground */
  svg.appendChild(el('ellipse',{cx:500,cy:952,rx:210,ry:14,class:'ground'}));
  /* trunk */
  const trunk = el('path',{class:'trunk', d:'M471 952 C481 830 486 690 494 536 L506 536 C514 690 519 830 529 952 C512 944 488 944 471 952 Z', fill:'url(#trunkG)'});
  svg.appendChild(trunk);
  /* branches + nodes per region */
  for (const r of ORDER){
    const a = ATTACH[r], b = TIPS[r];
    const dx=b[0]-a[0], dy=b[1]-a[1];
    const nx=-dy, ny=dx, m=Math.hypot(nx,ny)||1;
    const side = (b[0] < a[0]) ? 1 : -1; /* bulge outward */
    const c = [(a[0]+b[0])/2 + (nx/m)*34*side, (a[1]+b[1])/2 + (ny/m)*34*side];
    const bg = el('g',{class:'rlabel','data-region':r});
    bg.appendChild(el('path',{class:'branch', d:`M${a[0]} ${a[1]} Q${c[0]} ${c[1]} ${b[0]} ${b[1]}`, 'stroke-width': r==='egypt'||r==='persia' ? 5 : 6.5}));
    /* label position: outward from tip */
    const dir = [b[0]-a[0], b[1]-a[1]], lm=Math.hypot(dir[0],dir[1])||1;
    const ux=dir[0]/lm, uy=dir[1]/lm;
    const lx = b[0]+ux*26, ly = b[1]+uy*26;
    const anchor = Math.abs(ux)<0.35 ? 'middle' : (ux>0?'start':'end');
    const name = el('text',{x:lx, y:ly+ (uy>0.4? 8 : uy<-0.4? -12 : 4), 'text-anchor':anchor});
    name.textContent = REGIONS[r].toUpperCase();
    bg.appendChild(name);
    const cnt = el('text',{x:lx, y:ly+22+(uy>0.4? 8:0), class:'rcount','text-anchor':anchor});
    cnt.textContent = `${groups[r].length} trees`;
    bg.appendChild(cnt);
    bg.addEventListener('click', ()=>toggleRegion(r));
    svg.appendChild(bg);

    const trees = groups[r].slice().sort((x,y)=>x.name.localeCompare(y.name));
    trees.forEach((t,i)=>{
      const n = trees.length;
      const ti = n===1 ? 0.72 : 0.40 + 0.54*(i/(n-1));
      const p = qpoint(a,c,b,ti);
      const d = qdir(a,c,b,ti);
      const off = (i%2===0?1:-1) * 26;
      const px = p[0] + (-d[1])*off, py = p[1] + d[0]*off;
      const node = el('g',{class:'node','data-id':t.id,'data-region':t.region, transform:`translate(${px} ${py})`});
      node.style.color = t.emblem.accent||'#c9a86a';
      node.appendChild(el('circle',{class:'body', r:17, stroke:t.emblem.accent||'#c9a86a'}));
      const g = el('g',{transform:'translate(-11 -11)'});
      g.innerHTML = emblemSVG(t.emblem, 22);
      node.appendChild(g);
      node.addEventListener('click', ev=>{ ev.stopPropagation(); openPanel(t); });
      svg.appendChild(node);
    });
  }
  document.getElementById('count').textContent = `${DATA.length} trees · ${ORDER.length} regions`;
  document.getElementById('subtitle').textContent = `Sacred & mythic trees of the world — ${DATA.length} traditions across ${ORDER.length} regions`;
}

/* ---------- interactions ---------- */
function openPanel(t){
  activeId = t.id;
  document.querySelectorAll('.node').forEach(n=>n.classList.toggle('active', n.dataset.id===t.id));
  const meta = [['Region', REGIONS[t.region]],['Culture',t.culture],['Era',t.era],['Type',t.type],['Tree',t.tree],['Region id',null]];
  const mEl = document.getElementById('p-meta');
  mEl.innerHTML = [['Region',REGIONS[t.region]],['Culture',t.culture],['Era',t.era],['Type',t.type],['Tree',t.tree]]
    .map(([k,v])=>`<div><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
  document.getElementById('p-emblem').innerHTML = emblemSVG(t.emblem, 64);
  document.getElementById('p-name').textContent = t.name;
  document.getElementById('p-native').textContent = t.native;
  const body = document.getElementById('p-body');
  const photo = t.photo ? `<figure class="p-photo"><img src="${t.photo.url}" alt="${t.photo.label}" loading="lazy" onerror="this.closest('.p-photo').remove()"><figcaption>${t.photo.label} · species photo via Wikimedia Commons (Creative Commons)</figcaption></figure>` : '';
  let h = photo + `<h3>The Story</h3><p>${t.story}</p>
           <h3>History</h3><p>${t.history}</p>
           <h3>Details</h3><p>${t.details}</p>
           <h3>Symbolism</h3><div class="chips">${t.symbolism.map(s=>`<span class="chip">${s}</span>`).join('')}</div>
           <h3>Sources</h3><ul class="src">${t.sources.map(s=>`<li>${s}</li>`).join('')}</ul>
           <div class="footer-note">Compiled from primary religious texts, comparative mythology, and botanical references. Names in original scripts given where standard. Species photos via Wikimedia Commons (Creative Commons licenses).</div>`;
  body.innerHTML = h;
  body.scrollTop = 0;
  const p = document.getElementById('panel');
  p.classList.add('open'); p.setAttribute('aria-hidden','false');
  document.getElementById('hint').style.opacity = 0;
}
function closePanel(){
  activeId = null;
  document.querySelectorAll('.node.active').forEach(n=>n.classList.remove('active'));
  const p = document.getElementById('panel');
  p.classList.remove('open'); p.setAttribute('aria-hidden','true');
}
function toggleRegion(r){
  regionFocus = (regionFocus===r) ? null : r;
  applyFilter();
}
function applyFilter(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const matches = t => !q || (t.name+' '+t.culture+' '+t.tree+' '+t.type+' '+t.native).toLowerCase().includes(q);
  document.querySelectorAll('.node').forEach(n=>{
    const t = DATA.find(x=>x.id===n.dataset.id);
    const ok = matches(t) && (!regionFocus || t.region===regionFocus);
    n.classList.toggle('dim', !ok);
  });
  document.querySelectorAll('.rlabel').forEach(l=>l.classList.toggle('dim', !!regionFocus && l.dataset.region!==regionFocus));
}
document.getElementById('search').addEventListener('input', applyFilter);
document.getElementById('close').addEventListener('click', closePanel);
document.addEventListener('keydown', e=>{ if (e.key==='Escape') closePanel(); });
build();
</script>

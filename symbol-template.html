<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Symbols &amp; Art — Tree of Life</title>
<meta name="description" content="A gallery of Tree of Life symbols and artworks from world civilizations — Kabbalistic diagrams, sacred mosaics, carpets, world-trees, stupas and living ceibas.">
<style>
  :root{
    --bg0:#070b09; --bg1:#0d1512; --ink:#e8e2d4; --ink-dim:#9aa392;
    --line:#2a3a30; --panel:#0f1713; --node:#141d18; --gold:#c9a86a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family: Georgia,'Iowan Old Style','Palatino Linotype',serif;
    background: radial-gradient(120% 90% at 50% 8%, var(--bg1) 0%, var(--bg0) 72%);
    color:var(--ink); overflow:hidden;
  }
  a{color:var(--gold); text-decoration:none}
  a:hover{text-decoration:underline}
  header{
    position:fixed; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; gap:16px; padding:14px 22px;
    background:linear-gradient(180deg, rgba(7,11,9,.94), rgba(7,11,9,.6) 82%, transparent);
    backdrop-filter: blur(6px);
  }
  .brand{display:flex; align-items:center; gap:12px; min-width:0}
  .brand svg{width:34px;height:34px;flex:none}
  .brand .txt{min-width:0}
  .brand h1{font-size:17px; letter-spacing:.22em; font-weight:600; white-space:nowrap}
  .brand .sub{font-size:11.5px; color:var(--ink-dim); letter-spacing:.05em; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .back{
    display:flex; align-items:center; gap:7px; cursor:pointer;
    font:inherit; font-size:13px; letter-spacing:.04em; color:var(--ink-dim);
    background:transparent; border:1px solid var(--line); border-radius:999px;
    padding:8px 14px; transition:all .2s; white-space:nowrap;
  }
  .back:hover{color:var(--ink); border-color:var(--gold); text-decoration:none}
  header .spacer{flex:1}
  #search{
    background:rgba(20,29,24,.8); border:1px solid var(--line); color:var(--ink);
    border-radius:999px; padding:8px 16px; font:inherit; font-size:13.5px; width:220px;
    outline:none; transition:border-color .2s, width .25s;
  }
  #search:focus{border-color:var(--gold); width:270px}
  #search::placeholder{color:#6d786b}
  #count{font-size:12px; color:var(--ink-dim); letter-spacing:.06em; white-space:nowrap}

  /* filter bar */
  #filters{
    position:fixed; top:66px; left:0; right:0; z-index:19;
    display:flex; flex-direction:column; gap:8px; padding:14px 22px 16px;
    background:linear-gradient(180deg, rgba(7,11,9,.72), rgba(7,11,9,.35) 80%, transparent);
  }
  .frow{display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .frow .lbl{font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--gold); opacity:.8; width:88px; flex:none}
  .chip{
    font:inherit; font-size:12.5px; cursor:pointer;
    border:1px solid var(--line); border-radius:999px; padding:5px 13px;
    color:#cfd6c6; background:rgba(255,255,255,.02); transition:all .18s;
  }
  .chip:hover{border-color:#43554a; color:var(--ink)}
  .chip.on{background:rgba(201,168,106,.16); border-color:var(--gold); color:#f0e2c2}
  #clear{cursor:pointer; font:inherit; font-size:12px; color:var(--ink-dim); background:none; border:none; letter-spacing:.04em}
  #clear:hover{color:var(--gold); text-decoration:underline}

  main{position:absolute; top:132px; left:0; right:0; bottom:0; overflow-y:auto; padding:8px 22px 60px}
  #grid{
    display:grid; gap:18px; max-width:1500px; margin:0 auto;
    grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));
  }
  .card{
    border:1px solid var(--line); border-radius:14px; overflow:hidden; cursor:pointer;
    background:var(--panel); transition:transform .2s, border-color .2s, box-shadow .2s;
    display:flex; flex-direction:column;
  }
  .card:hover{transform:translateY(-3px); border-color:#43554a; box-shadow:0 14px 34px rgba(0,0,0,.42)}
  .card.active{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold), 0 14px 34px rgba(0,0,0,.5)}
  .card .img{position:relative; height:230px; background:#0a100d; overflow:hidden}
  .card .img img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .35s}
  .card:hover .img img{transform:scale(1.05)}
  .card .img .badge{
    position:absolute; top:10px; left:10px; font-size:10.5px; letter-spacing:.08em;
    color:#e9dfc9; background:rgba(7,11,9,.72); border:1px solid var(--line);
    padding:3px 9px; border-radius:999px; backdrop-filter:blur(4px);
  }
  .card .img .lic{
    position:absolute; bottom:10px; right:10px; font-size:9.5px; letter-spacing:.06em;
    color:#b9c1b0; background:rgba(7,11,9,.72); padding:2px 8px; border-radius:999px; border:1px solid var(--line);
  }
  .card .cap{padding:13px 15px 15px}
  .card .name{font-size:15.5px; line-height:1.3; font-weight:600}
  .card .sub2{font-size:12px; color:var(--ink-dim); margin-top:5px; line-height:1.45}
  #empty{grid-column:1/-1; text-align:center; color:var(--ink-dim); font-size:14px; padding:70px 0; line-height:1.8}

  /* detail panel */
  #panel{
    position:fixed; top:0; right:0; bottom:0; width:min(520px, 96vw); z-index:30;
    background:var(--panel); border-left:1px solid var(--line);
    transform:translateX(105%); transition:transform .35s cubic-bezier(.22,.8,.3,1);
    display:flex; flex-direction:column;
  }
  #panel.open{transform:translateX(0); box-shadow:-30px 0 60px rgba(0,0,0,.5)}
  .p-head{position:relative; padding:26px 28px 18px; border-bottom:1px solid var(--line); background:radial-gradient(90% 130% at 20% 0%, rgba(255,255,255,.03), transparent)}
  #close{
    position:absolute; top:16px; right:16px; width:32px; height:32px; border-radius:50%;
    border:1px solid var(--line); background:transparent; color:var(--ink-dim);
    font-size:15px; cursor:pointer; line-height:1; transition:all .2s;
  }
  #close:hover{color:var(--ink); border-color:var(--gold)}
  .p-kicker{font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); opacity:.85}
  #panel h2{font-size:23px; line-height:1.25; font-weight:600; margin-top:8px; padding-right:36px}
  .meta{display:grid; grid-template-columns:1fr 1fr; gap:11px 16px; margin-top:18px}
  .meta .k{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); opacity:.85}
  .meta .v{font-size:13.5px; line-height:1.45; margin-top:2px}
  .p-body{overflow-y:auto; padding:22px 28px 44px; flex:1; scrollbar-width:thin; scrollbar-color:#2a3a30 transparent}
  .p-img{margin:0 0 18px; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#0a100d; display:flex; align-items:center; justify-content:center; min-height:120px}
  .p-img img{max-width:100%; max-height:430px; object-fit:contain; display:block}
  .p-img figcaption{font-size:11px; color:#5c685c; line-height:1.55; padding:8px 12px; border-top:1px solid var(--line); width:100%}
  .p-body h3{font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); margin:24px 0 9px; font-weight:600}
  .p-body h3:first-child{margin-top:0}
  .p-body p{font-size:14.5px; line-height:1.72; color:#d6d2c4}
  .credit{font-size:13px; color:#c9c4b4; line-height:1.6}
  .lic-line{display:flex; flex-wrap:wrap; gap:7px; align-items:center}
  .lic-chip{font-size:11.5px; border:1px solid var(--line); border-radius:999px; padding:3px 11px; color:#cfd6c6; background:rgba(255,255,255,.02)}
  .src-link{display:inline-block; margin-top:2px; font-size:13.5px}
  .footer-note{font-size:11px; color:#5c685c; line-height:1.6; margin-top:26px; border-top:1px solid var(--line); padding-top:14px}

  @media (max-width:900px){
    .brand .sub{display:none}
    #search{width:150px}
    #count{display:none}
    .frow .lbl{width:auto; flex:1 1 100%}
  }
</style>
</head>
<body>
<header>
  <button class="back" id="back" onclick="location.href='index.html'">
    <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Atlas</span>
  </button>
  <div class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <path d="M20 36 L20 20 M20 24 L12 13 M20 22 L28 11 M12 13 L9 9 M28 11 L31 7" stroke="#c9a86a" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="20" cy="36" r="2.4" fill="#c9a86a"/>
    </svg>
    <div class="txt">
      <h1>TREE OF LIFE</h1>
      <div class="sub">Symbols &amp; Art of the World</div>
    </div>
  </div>
  <div class="spacer"></div>
  <input id="search" type="text" placeholder="Search symbols, cultures, forms…" autocomplete="off" spellcheck="false">
  <div id="count"></div>
</header>

<div id="filters">
  <div class="frow" id="civrow"><span class="lbl">Tradition</span></div>
  <div class="frow" id="typerow"><span class="lbl">Form</span></div>
</div>

<main id="main">
  <div id="grid"></div>
</main>

<aside id="panel" aria-hidden="true">
  <div class="p-head">
    <button id="close" aria-label="Close">✕</button>
    <div class="p-kicker" id="p-kicker"></div>
    <h2 id="p-name"></h2>
    <div class="meta" id="p-meta"></div>
  </div>
  <div class="p-body" id="p-body"></div>
</aside>

<script>
const DATA = /*__SYMBOL_DATA__*/;

const civs = [...new Set(DATA.map(d=>d.civ))].sort((a,b)=>a.localeCompare(b));
const types = [...new Set(DATA.map(d=>d.type))].sort((a,b)=>a.localeCompare(b));
let selCiv = new Set(), selType = new Set();
let activeId = null;

function chip(label, kind, val){
  const b = document.createElement('button');
  b.className = 'chip'; b.textContent = label; b.dataset.kind = kind; b.dataset.val = val;
  b.addEventListener('click', ()=>{
    const set = kind==='civ'?selCiv:selType;
    if (set.has(val)) set.delete(val); else set.add(val);
    b.classList.toggle('on');
    applyFilter();
  });
  return b;
}
function allChip(kind){
  const b = document.createElement('button');
  b.className='chip on'; b.textContent='All'; b.dataset.kind=kind; b.dataset.val='__all__';
  b.addEventListener('click', ()=>{
    const set = kind==='civ'?selCiv:selType;
    set.clear();
    document.querySelectorAll(`.chip[data-kind="${kind}"]`).forEach(c=>{
      if (c.dataset.val!=='__all__') c.classList.remove('on');
    });
    b.classList.add('on');
    applyFilter();
  });
  return b;
}
const civrow = document.getElementById('civrow');
civrow.appendChild(allChip('civ'));
civs.forEach(v=>civrow.appendChild(chip(v,'civ',v)));
const typerow = document.getElementById('typerow');
typerow.appendChild(allChip('type'));
types.forEach(v=>typerow.appendChild(chip(v,'type',v)));
const clr = document.createElement('button'); clr.id='clear'; clr.textContent='reset filters';
clr.addEventListener('click', ()=>{ selCiv.clear(); selType.clear();
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  document.querySelectorAll('.chip[data-val="__all__"]').forEach(c=>c.classList.add('on'));
  applyFilter();
});
typerow.appendChild(clr);

function matches(d){
  if (selCiv.size && !selCiv.has(d.civ)) return false;
  if (selType.size && !selType.has(d.type)) return false;
  const q = document.getElementById('search').value.trim().toLowerCase();
  if (q){
    const hay = (d.name+' '+d.civ+' '+d.type+' '+d.location+' '+d.era+' '+d.desc).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function buildGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  DATA.forEach(d=>{
    const card = document.createElement('div');
    card.className='card'; card.dataset.id=d.id; card.dataset.civ=d.civ; card.dataset.type=d.type;
    const img = d.img||d.full||'';
    card.innerHTML =
      `<div class="img">
         <img src="${img}" alt="${d.name}" loading="lazy" onerror="this.style.opacity=.15">
         <span class="badge">${d.civ}</span>
         <span class="lic">${d.license}</span>
       </div>
       <div class="cap">
         <div class="name">${d.name}</div>
         <div class="sub2">${d.type} · ${d.era}</div>
       </div>`;
    card.addEventListener('click', ()=>openPanel(d));
    grid.appendChild(card);
  });
}

function applyFilter(){
  let shown = 0;
  document.querySelectorAll('.card').forEach(c=>{
    const d = DATA.find(x=>x.id===c.dataset.id);
    const ok = matches(d);
    c.style.display = ok ? '' : 'none';
    if (ok) shown++;
  });
  const empty = document.getElementById('empty');
  if (empty) empty.remove();
  if (!shown){
    const e = document.createElement('div'); e.id='empty';
    e.innerHTML = 'No symbols match these filters.<br><button class="chip" style="margin-top:14px" onclick="document.getElementById(\'clear\').click()">reset filters</button>';
    document.getElementById('grid').appendChild(e);
  }
  document.getElementById('count').textContent = `${shown} of ${DATA.length} symbols`;
}

function esc(s){ return (s||'').replace(/[&<>]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

function openPanel(d){
  activeId = d.id;
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('active', c.dataset.id===d.id));
  document.getElementById('p-kicker').textContent = d.civ;
  document.getElementById('p-name').textContent = d.name;
  const meta = [['Era',d.era],['Form',d.type],['Location',d.location],['License',d.license]];
  document.getElementById('p-meta').innerHTML =
    meta.map(([k,v])=>`<div><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`).join('');
  const body = document.getElementById('p-body');
  const src = d.full||d.img||'';
  const fig = src ? `<figure class="p-img"><img src="${src}" alt="${esc(d.name)}" onerror="this.style.display='none'"><figcaption>${esc(d.credit)}</figcaption></figure>` : '';
  body.innerHTML = fig +
    `<h3>Symbol</h3><p>${esc(d.desc)}</p>` +
    `<h3>Credit</h3><div class="credit">${esc(d.credit)}</div>` +
    (d.artist ? `<h3>Artist / Source</h3><div class="credit">${esc(d.artist)}</div>` : '') +
    `<h3>License</h3><div class="lic-line"><span class="lic-chip">${esc(d.license)}</span></div>` +
    (d.source ? `<h3>Reference</h3><a class="src-link" href="${esc(d.source)}" target="_blank" rel="noopener">View on Wikimedia Commons ↗</a>` : '') +
    `<div class="footer-note">Imagery sourced from Wikimedia Commons under the license shown. ${esc(d.credit)}. Symbols compiled as a visual companion to the Tree of Life atlas.</div>`;
  body.scrollTop = 0;
  const p = document.getElementById('panel');
  p.classList.add('open'); p.setAttribute('aria-hidden','false');
}
function closePanel(){
  activeId = null;
  document.querySelectorAll('.card.active').forEach(c=>c.classList.remove('active'));
  const p = document.getElementById('panel');
  p.classList.remove('open'); p.setAttribute('aria-hidden','true');
}
document.getElementById('search').addEventListener('input', applyFilter);
document.getElementById('close').addEventListener('click', closePanel);
document.addEventListener('keydown', e=>{ if (e.key==='Escape') closePanel(); });
document.getElementById('main').addEventListener('scroll', ()=>{});

buildGrid();
applyFilter();
</script>
</body>
</html>
